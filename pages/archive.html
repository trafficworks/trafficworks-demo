<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Count Company — Archive</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>

<div class="container">
  <div class="nav">
    <a class="nav-brand" href="projects.html">
      <div class="nav-logo"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></div>
      <span class="nav-name">The Count Company</span>
    </a>
    <div class="nav-links">
      <a href="projects.html">Projects</a>
      <a href="team.html">Team</a>
      <a href="archive.html" class="active">Archive</a>
    </div>
    <button class="m-kebab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
  </div>
  <div class="nav-line"></div>
</div>

<div class="container main">
  <div class="page-header">
    <div>
      <span class="page-title">Archive</span>
      <span class="page-count" id="archiveCount"></span>
    </div>
  </div>

  <div class="search-row">
    <div class="search-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input class="search-input" type="text" placeholder="Search archived projects…" id="searchInput" oninput="renderArchive()">
    </div>
  </div>

  <div id="archiveTable"></div>

  <!-- Mobile view -->
  <div class="mobile-only">
    <div id="mobileArchiveList"></div>
  </div>

  <div class="table-footer" id="tableFooter"></div>
</div>

<!-- EDIT MODAL -->
<div class="modal-overlay" id="editModal"><div class="modal">
  <div class="modal-title">Edit Project</div>
  <div class="form-group"><label class="form-label">Project Name</label><input class="form-input" id="editName"></div>
  <div class="form-group"><label class="form-label">Client</label><input class="form-input" id="editClient"></div>
  <div class="form-group"><label class="form-label">Location</label><input class="form-input" id="editLocation"></div>
  <div class="modal-actions"><button class="btn-ghost" onclick="closeEditModal()">Cancel</button><button class="btn-solid" onclick="saveEdit()">Save</button></div>
</div></div>

<!-- DELETE MODAL -->
<div class="modal-overlay" id="deleteModal"><div class="modal">
  <div class="modal-title">Delete Project</div>
  <div class="modal-body" id="deleteBody"></div>
  <div class="modal-actions"><button class="btn-ghost" onclick="closeDeleteModal()">Cancel</button><button class="btn-danger" onclick="confirmDelete()">Delete</button></div>
</div></div>

<!-- RESTORE MODAL -->
<div class="modal-overlay" id="restoreModal"><div class="modal">
  <div class="modal-title">Restore Project</div>
  <div class="modal-body" id="restoreBody"></div>
  <div class="modal-actions"><button class="btn-ghost" onclick="closeRestoreModal()">Cancel</button><button class="btn-solid" onclick="confirmRestore()">Restore</button></div>
</div></div>

<div class="toast" id="toast"></div>

<script>
var archivedProjects=[
  {id:1,name:'Civic Center Speed Survey',projectNum:'DEMO-2026-090',client:'City of Burbank',location:'Burbank, CA',
   completedDate:'Feb 20, 2026',archivedDate:'Feb 22, 2026',
   bulkFiles:['CivicCenter_EB_Speed.pdf','CivicCenter_WB_Speed.pdf','CivicCenter_EB_Speed.xlsx','CivicCenter_WB_Speed.xlsx','Downtown_TMC_Main.pdf','Downtown_TMC_Main.xlsx'],
   tasks:[{site:1,desc:'Speed Survey Civic Center EB',type:'SPD'},{site:2,desc:'Speed Survey Civic Center WB',type:'SPD'},{site:3,desc:'TMC Olive & San Fernando',type:'TMC'},{site:4,desc:'TMC Olive & Magnolia',type:'TMC'}]},
  {id:2,name:'University District Count Set',projectNum:'DEMO-2026-088',client:'City of Irvine',location:'Irvine, CA',
   completedDate:'Feb 12, 2026',archivedDate:'Feb 14, 2026',
   bulkFiles:['CampusLoop_ADT_NB.pdf','CampusLoop_ADT_SB.pdf','CampusLoop_ADT_NB.xlsx','CampusLoop_ADT_SB.xlsx','Bridge_Count_Bike.pdf'],
   tasks:[{site:1,desc:'ADT Campus Loop NB',type:'ADT'},{site:2,desc:'ADT Campus Loop SB',type:'ADT'},{site:3,desc:'Bike Count Bridge Plaza',type:'CLS'},{site:4,desc:'TMC Campus & California',type:'TMC'},{site:5,desc:'TMC Campus & University',type:'TMC'}]},
  {id:3,name:'Waterfront Before/After Review',projectNum:'DEMO-2026-081',client:'Port Mobility Partners',location:'San Pedro, CA',
   completedDate:'Jan 28, 2026',archivedDate:'Jan 30, 2026',
   bulkFiles:['Waterfront_BeforeAfter_Summary.pdf','Waterfront_BeforeAfter_Data.xlsx'],
   tasks:[{site:1,desc:'ADT Harbor Blvd NB',type:'ADT'},{site:2,desc:'ADT Harbor Blvd SB',type:'ADT'},{site:3,desc:'Ped Count 6th Street Plaza',type:'CLS'},{site:4,desc:'Bike Count Harbor Promenade',type:'CLS'}]}
];

var expandedId=null, openKebab=null, editTarget=null, deleteTarget=null, restoreTarget=null;

function getFileExt(name){ var parts=name.split('.'); return parts[parts.length-1].toUpperCase(); }
function getFileName(name){ return name.replace(/\.[^.]+$/,''); }
function getTypeClass(type){ return type==='TMC'?'type-tmc':type==='SPD'?'type-spd':type==='ADT'?'type-adt':''; }

function renderArchive(){
  var search=(document.getElementById('searchInput').value||'').toLowerCase();
  var filtered=archivedProjects.filter(function(p){
    return !search||p.name.toLowerCase().indexOf(search)>-1||(p.client||'').toLowerCase().indexOf(search)>-1||(p.location||'').toLowerCase().indexOf(search)>-1;
  });

  document.getElementById('archiveCount').textContent=filtered.length+' project'+(filtered.length!==1?'s':'');

  var totalFiles=filtered.reduce(function(s,p){return s+p.bulkFiles.length},0);
  var totalTasks=filtered.reduce(function(s,p){return s+p.tasks.length},0);
  document.getElementById('tableFooter').textContent=filtered.length+' archived projects · '+totalTasks+' tasks · '+totalFiles+' files';

  if(filtered.length===0){
    document.getElementById('archiveTable').innerHTML='<div style="text-align:center;padding:60px 20px;color:var(--text-3)">No archived projects'+(search?' match your search':'')+'</div>';
    return;
  }

  var html='<table><thead><tr>'+
    '<th style="width:3%"></th>'+
    '<th style="width:27%">Project</th>'+
    '<th style="width:14%">Location</th>'+
    '<th style="width:8%" class="c">Tasks</th>'+
    '<th style="width:13%">Completed</th>'+
    '<th style="width:13%">Archived</th>'+
    '<th style="width:10%">Files</th>'+
    '<th style="width:4%"></th>'+
  '</tr></thead><tbody>';

  filtered.forEach(function(p){
    var isExpanded=expandedId===p.id;

    html+='<tr class="'+(isExpanded?'row-expanded':'')+'" onclick="toggleExpand('+p.id+')">';
    html+='<td><span class="row-chevron"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></span></td>';
    html+='<td><div class="cell-name">'+p.name+'</div><div class="cell-sub">'+p.client+'</div></td>';
    html+='<td><span class="cell-secondary">'+p.location+'</span></td>';
    html+='<td class="c"><span class="cell-num">'+p.tasks.length+'</span></td>';
    html+='<td><span class="cell-date">'+p.completedDate+'</span></td>';
    html+='<td><span class="cell-date">'+p.archivedDate+'</span></td>';
    html+='<td><span class="cell-secondary" style="display:inline-flex;align-items:center;gap:4px;font-size:12px"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>'+p.bulkFiles.length+'</span></td>';
    html+='<td class="r kebab-cell"><button class="kebab" onclick="event.stopPropagation();toggleKebab('+p.id+',event)"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg></button>';
    html+='<div class="kebab-menu" id="kebab-'+p.id+'">';
    html+='<button class="kebab-menu-item" onclick="event.stopPropagation();openEditModal('+p.id+')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>Edit</button>';
    html+='<button class="kebab-menu-item" onclick="event.stopPropagation();openRestoreModal('+p.id+')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9"/><polyline points="3 3 3 7 7 7"/></svg>Restore</button>';
    html+='<button class="kebab-menu-item danger" onclick="event.stopPropagation();openDeleteModal('+p.id+')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>Delete</button>';
    html+='</div></td></tr>';

    // Expanded panel
    if(isExpanded){
      html+='<tr class="expand-row" onclick="event.stopPropagation()"><td colspan="8"><div class="expand-panel">';

      // Action strip
      html+='<div class="action-strip">';
      html+='<button class="btn-small" onclick="downloadAll('+p.id+')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>Download All</button>';
      html+='<button class="btn-small btn-upload" onclick="document.getElementById(\'upload-'+p.id+'\').click()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>Upload Files<input type="file" id="upload-'+p.id+'" multiple accept=".pdf,.xlsx,.xls,.csv" style="display:none" onchange="bulkUpload('+p.id+')"></button>';
      html+='<button class="btn-small"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>Audit Report</button>';
      html+='</div>';

      // Two columns
      html+='<div class="expand-columns">';

      // LEFT — sites
      html+='<div style="width:42%;flex-shrink:0">';
      html+='<div class="expand-col-label">Sites <span class="col-count">'+p.tasks.length+'</span></div>';
      html+='<ul class="file-list">';
      p.tasks.forEach(function(t){
        var tc=getTypeClass(t.type||'');
        html+='<li class="file-item"><span class="site-num" style="min-width:22px">#'+t.site+'</span><span class="file-name" style="color:var(--text)">'+t.desc+'</span>'+(t.type?'<span class="type-pill '+tc+'" style="font-size:9px;min-width:32px;padding:2px 6px">'+t.type+'</span>':'')+'</li>';
      });
      html+='</ul></div>';

      html+='<div class="expand-divider"></div>';

      // RIGHT — files grouped
      html+='<div style="flex:1;min-width:0">';
      html+='<div class="expand-col-label">Files <span class="col-count">'+p.bulkFiles.length+'</span></div>';
      html+='<ul class="file-list">';
      p.bulkFiles.forEach(function(f,i){
        var ext=getFileExt(f), name=getFileName(f);
        var isXls=ext==='XLSX'||ext==='XLS'||ext==='CSV';
        var icon=isXls
          ?'<svg class="file-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="21" x2="9" y2="9"/></svg>'
          :'<svg class="file-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>';
        html+='<li class="file-item">'+icon+'<span class="file-name">'+name+'</span><span class="file-ext">'+ext+'</span>';
        html+='<button class="file-delete" onclick="deleteFile('+p.id+','+i+')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>';
        html+='<button class="file-action" onclick="downloadFile('+p.id+','+i+')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg></button>';
        html+='</li>';
      });
      html+='</ul></div>';

      html+='</div>'; // expand-columns
      html+='</div></td></tr>'; // expand-panel
    }
  });

  html+='</tbody></table>';
  document.getElementById('archiveTable').innerHTML=html;

  // Mobile render
  var mArch = document.getElementById('mobileArchiveList');
  if(mArch) {
    var mHtml = '';
    filtered.forEach(function(p) {
      mHtml += '<div class="m-project-row" onclick="toggleExpand('+p.id+')">';
      mHtml += '<div class="m-project-left">';
      mHtml += '<div class="m-project-name">'+p.name+'</div>';
      mHtml += '<div class="m-project-detail">'+p.client+' · '+p.tasks.length+' tasks</div>';
      mHtml += '</div>';
      mHtml += '<div class="m-project-right">';
      mHtml += '<div class="m-project-tasks">'+p.bulkFiles.length+' files</div>';
      mHtml += '<div class="m-project-tasks" style="font-size:10px">'+p.archivedDate+'</div>';
      mHtml += '</div>';
      mHtml += '</div>';

      // Expanded panel on mobile
      if(expandedId === p.id) {
        mHtml += '<div style="padding:12px 0 16px;border-bottom:1px solid var(--line);border-left:3px solid var(--accent);padding-left:16px;margin-left:4px">';
        
        // Action buttons
        mHtml += '<div style="display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap">';
        mHtml += '<button class="btn-small" onclick="event.stopPropagation();downloadAll('+p.id+')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:12px;height:12px"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>Download All</button>';
        mHtml += '<button class="btn-small btn-upload" onclick="event.stopPropagation();document.getElementById(\'upload-'+p.id+'\').click()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:12px;height:12px"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>Upload<input type="file" id="upload-'+p.id+'" multiple accept=".pdf,.xlsx,.xls,.csv" style="display:none" onchange="bulkUpload('+p.id+')"></button>';
        mHtml += '</div>';

        // Sites
        mHtml += '<div class="expand-col-label" style="margin-bottom:6px">Sites <span class="col-count">'+p.tasks.length+'</span></div>';
        p.tasks.forEach(function(t) {
          var tc = getTypeClass(t.type||'');
          mHtml += '<div style="display:flex;align-items:center;gap:6px;padding:4px 0;font-size:12px">';
          mHtml += '<span style="color:var(--text-3);min-width:18px;font-variant-numeric:tabular-nums">#'+t.site+'</span>';
          mHtml += '<span style="flex:1;color:var(--text);overflow:hidden;white-space:nowrap;text-overflow:ellipsis">'+t.desc+'</span>';
          if(t.type) mHtml += '<span class="type-pill '+tc+'" style="font-size:9px;min-width:28px;padding:1px 5px">'+t.type+'</span>';
          mHtml += '</div>';
        });

        // Files
        if(p.bulkFiles.length > 0) {
          mHtml += '<div class="expand-col-label" style="margin-top:12px;margin-bottom:6px">Files <span class="col-count">'+p.bulkFiles.length+'</span></div>';
          p.bulkFiles.forEach(function(f, i) {
            var ext = getFileExt(f), name = getFileName(f);
            mHtml += '<div style="display:flex;align-items:center;gap:6px;padding:4px 0;font-size:12px">';
            mHtml += '<span style="flex:1;color:var(--text-2);overflow:hidden;white-space:nowrap;text-overflow:ellipsis">'+name+'</span>';
            mHtml += '<span class="file-ext">'+ext+'</span>';
            mHtml += '<button class="file-action" onclick="event.stopPropagation();downloadFile('+p.id+','+i+')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg></button>';
            mHtml += '</div>';
          });
        }

        mHtml += '</div>';
      }
    });
    mArch.innerHTML = mHtml;
  }
}

function toggleExpand(id){ expandedId=expandedId===id?null:id; renderArchive(); }

function downloadFile(pid,idx){ var p=archivedProjects.find(function(x){return x.id===pid}); if(p) showToast('Downloading "'+p.bulkFiles[idx]+'"'); }
function downloadAll(pid){ var p=archivedProjects.find(function(x){return x.id===pid}); if(p) showToast('Downloading '+p.bulkFiles.length+' files'); }

function deleteFile(pid,idx){
  var p=archivedProjects.find(function(x){return x.id===pid}); if(!p) return;
  var name=p.bulkFiles[idx];
  p.bulkFiles.splice(idx,1);
  renderArchive();
  showToast('"'+name+'" deleted');
}

function bulkUpload(pid){
  var input=document.getElementById('upload-'+pid);
  var files=input.files; if(!files||files.length===0) return;
  var p=archivedProjects.find(function(x){return x.id===pid}); if(!p) return;
  for(var i=0;i<files.length;i++) p.bulkFiles.push(files[i].name);
  input.value='';
  renderArchive();
  showToast(files.length+' file'+(files.length!==1?'s':'')+' uploaded');
}

// Kebab
var openKebab=null;
function toggleKebab(id,e){
  e.stopPropagation();
  if(openKebab&&openKebab!==id){var old=document.getElementById('kebab-'+openKebab);if(old)old.classList.remove('open','drop-up','drop-down');}
  var menu=document.getElementById('kebab-'+id);
  var isOpen=menu.classList.contains('open');
  menu.classList.remove('open','drop-up','drop-down');
  if(!isOpen){var rect=e.currentTarget.getBoundingClientRect();menu.classList.add('open',(window.innerHeight-rect.bottom)<160?'drop-up':'drop-down');openKebab=id;}
  else{openKebab=null;}
}
function closeKebabs(){if(openKebab){var el=document.getElementById('kebab-'+openKebab);if(el)el.classList.remove('open','drop-up','drop-down');openKebab=null;}}
document.addEventListener('click',closeKebabs);

// Edit
var editTarget=null;
function openEditModal(id){
  closeKebabs();editTarget=id;
  var p=archivedProjects.find(function(x){return x.id===id});if(!p)return;
  document.getElementById('editName').value=p.name;
  document.getElementById('editClient').value=p.client;
  document.getElementById('editLocation').value=p.location;
  document.getElementById('editModal').classList.add('visible');
}
function closeEditModal(){document.getElementById('editModal').classList.remove('visible');editTarget=null;}
function saveEdit(){
  if(!editTarget)return;
  var p=archivedProjects.find(function(x){return x.id===editTarget});if(!p)return;
  p.name=document.getElementById('editName').value.trim()||p.name;
  p.client=document.getElementById('editClient').value.trim();
  p.location=document.getElementById('editLocation').value.trim();
  closeEditModal();renderArchive();showToast('Project updated');
}

// Delete
var deleteTarget=null;
function openDeleteModal(id){
  closeKebabs();deleteTarget=id;
  var p=archivedProjects.find(function(x){return x.id===id});
  document.getElementById('deleteBody').textContent='Permanently delete "'+(p?p.name:'this project')+'" and all its files? This cannot be undone.';
  document.getElementById('deleteModal').classList.add('visible');
}
function closeDeleteModal(){document.getElementById('deleteModal').classList.remove('visible');deleteTarget=null;}
function confirmDelete(){
  if(!deleteTarget)return;
  archivedProjects=archivedProjects.filter(function(x){return x.id!==deleteTarget});
  if(expandedId===deleteTarget) expandedId=null;
  deleteTarget=null;closeDeleteModal();renderArchive();showToast('Project deleted');
}

// Restore
var restoreTarget=null;
function openRestoreModal(id){
  closeKebabs();restoreTarget=id;
  var p=archivedProjects.find(function(x){return x.id===id});
  document.getElementById('restoreBody').textContent='Restore "'+(p?p.name:'this project')+'" to active projects?';
  document.getElementById('restoreModal').classList.add('visible');
}
function closeRestoreModal(){document.getElementById('restoreModal').classList.remove('visible');restoreTarget=null;}
function confirmRestore(){
  if(!restoreTarget)return;
  var p=archivedProjects.find(function(x){return x.id===restoreTarget});
  archivedProjects=archivedProjects.filter(function(x){return x.id!==restoreTarget});
  if(expandedId===restoreTarget) expandedId=null;
  restoreTarget=null;closeRestoreModal();renderArchive();showToast('"'+(p?p.name:'Project')+'" restored');
}

function showToast(msg){
  var el=document.getElementById('toast');el.textContent=msg;el.classList.add('visible');
  clearTimeout(el._timer);el._timer=setTimeout(function(){el.classList.remove('visible')},2500);
}

document.querySelectorAll('.modal-overlay').forEach(function(el){el.addEventListener('click',function(e){if(e.target===this)this.classList.remove('visible')});});
document.addEventListener('keydown',function(e){if(e.key==='Escape'){closeEditModal();closeDeleteModal();closeRestoreModal();}});

renderArchive();
</script>

</body>
