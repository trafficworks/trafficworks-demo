<style>
/* ── MOBILE CARD NAV ── */
.mc-topnav { display: none; }

@media (max-width: 768px) {
  .container > .nav,
  .container > .nav-line,
  .mobile-nav-menu,
  .container > .page-header,
  .container > .search-row,
  #projectSections,
  .table-footer { display: none !important; }

  .mc-topnav {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 10px;
    padding: 22px 20px 14px;
  }
  .mc-topnav a {
    font-size: 17px;
    font-weight: 400;
    color: var(--text-3);
    text-decoration: none;
    letter-spacing: -0.02em;
    white-space: nowrap;
  }
  .mc-topnav a.active {
    font-weight: 700;
    color: var(--text);
  }
  .mc-topnav-dot {
    font-size: 17px;
    color: var(--text-3);
    font-weight: 400;
    flex-shrink: 0;
  }

  .mobile-only { display: block !important; }

  .m-page-sub {
    padding: 0 16px 12px;
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-3);
    text-align: center;
    display: block;
    width: 100%;
  }

  /* ── CARD LIST — 6px sides = max width ── */
  #mobileProjectList {
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 0 14px 40px;
    max-width: 480px;
    margin: 0 auto;
    width: 100%;
    box-sizing: border-box;
  }

  /* ── BASE CARD ── */
  .mc {
    border-radius: 20px;
    padding: 16px 16px 14px;
    display: flex;
    flex-direction: column;
    position: relative;
    width: 100%;
  }
  /* no badge row — tighter top */
  .mc.mc-no-topbar { padding-top: 16px; }

  /* ── CARD COLORS ──
     Pending (no infield activity) = amber
     In Progress (has infield)     = blue
     On Hold                       = red
     Complete                      = green
  */
  .mc-pending    { background: #EDE0B0 !important; color: #6B4A08 !important; }
  .mc-inprogress { background: #C8DCF2 !important; color: #1C4A7A !important; }
  .mc-hold { background: #D8D6D1 !important; color: #5A5850 !important; }
  .mc-complete   { background: #BDE0CC !important; color: #1A5C35 !important; }

  /* ── TOP BAR: left | center | right — all inline ── */
  .mc-top-bar {
    display: flex;
    align-items: center;
    width: 100%;
    margin-bottom: 10px;
    min-height: 26px;
  }
  .mc-top-left  { flex-shrink: 0; }
  .mc-top-mid   { flex: 1; display: flex; justify-content: center; }
  .mc-top-right { flex-shrink: 0; }

  /* shared pill base */
  .mc-pill-sm {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    padding: 4px 10px;
    border-radius: 100px;
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }

  /* In Progress badge — blue, blinking dot */
  .mc-badge-inprogress {
    background: rgba(28,74,122,0.14);
    color: #1C4A7A;
  }
  .mc-blink {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #3AA66A;
    flex-shrink: 0;
    animation: mcblink 1.8s ease-in-out infinite;
  }
  @keyframes mcblink { 0%,100%{opacity:1} 50%{opacity:0.2} }

  /* On Hold badge */
  .mc-badge-hold {
    background: rgba(90,88,80,0.14);
    color: #5A5850;
  }

  /* Complete badge */
  .mc-badge-complete {
    background: rgba(26,92,53,0.16);
    color: #1A5C35;
  }

  /* In Field pill — center, green dot, tinted to card color */
  .mc-infield-pill {
    background: rgba(58,166,106,0.15);
    color: #1A5C35;
  }
  .mc-inprogress .mc-infield-pill { color: #1C4A7A; background: rgba(28,74,122,0.1); }
  .mc-hold       .mc-infield-pill { color: #5A5850; background: rgba(90,88,80,0.1); }
  .mc-if-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #3AA66A;
    flex-shrink: 0;
  }

  /* Pending pill — upper right, amber always */
  .mc-pending-pill {
    background: rgba(212,168,67,0.22);
    color: #6B4A08;
  }
  .mc-pd-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #D4A843;
    flex-shrink: 0;
  }

  /* ── NAME ROW — with optional right-aligned checkmark ── */
  .mc-name-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 2px;
  }
  .mc-check {
    flex-shrink: 0;
    width: 20px; height: 20px;
    border-radius: 50%;
    background: rgba(26,92,53,0.15);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .mc-check svg { display: block; }

  /* ── NAME + CITY ── */
  .mc-name {
    font-size: 16px;
    font-weight: 700;
    letter-spacing: -0.025em;
    line-height: 1.25;
    margin-bottom: 2px;
    color: inherit;
  }
  .mc-city {
    font-size: 13px;
    opacity: 0.6;
    margin-bottom: 14px;
  }

  /* ── DIVIDER ── */
  .mc-divider { width: 100%; height: 1px; margin-bottom: 12px; }
  .mc-pending    .mc-divider { background: rgba(107,74,8,0.12); }
  .mc-inprogress .mc-divider { background: rgba(28,74,122,0.12); }
  .mc-hold       .mc-divider { background: rgba(122,32,32,0.12); }
  .mc-complete   .mc-divider { background: rgba(26,92,53,0.12); }

  /* ── COUNTER ── */
  .mc-counter {
    font-size: 54px;
    font-weight: 700;
    letter-spacing: -0.05em;
    line-height: 1;
    margin-bottom: 3px;
    align-self: center;
  }
  .mc-slash, .mc-total { opacity: 0.28; font-weight: 400; }
  .mc-complete .mc-done { color: #3AA66A; }

  .mc-counter-label {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    opacity: 0.45;
    margin-bottom: 14px;
    align-self: center;
  }

  /* ── VIEW JOB SHEET PILL ── */
  .mc-pill {
    width: 100%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    padding: 12px;
    border-radius: 100px;
    border: none;
    font-family: var(--font);
    font-size: 13px;
    font-weight: 600;
    letter-spacing: -0.01em;
    cursor: pointer;
    transition: opacity 0.15s;
  }
  .mc-pill:active { opacity: 0.75; }
  .mc-pending    .mc-pill { background: rgba(107,74,8,0.11);   color: #6B4A08; }
  .mc-inprogress .mc-pill { background: rgba(28,74,122,0.11);  color: #1C4A7A; }
  .mc-hold       .mc-pill { background: rgba(90,88,80,0.11);  color: #5A5850; }
  .mc-hold .mc-prog { background: rgba(90,88,80,.15); }
  .mc-hold .mc-prog-fill { background: #9A9890; }
  .mc-complete   .mc-pill { background: rgba(26,92,53,0.12);   color: #1A5C35; }

  /* ── PROGRESS BAR ── */
  .mc-prog { width: 100%; height: 3px; border-radius: 99px; margin-top: 12px; overflow: hidden; }
  .mc-pending    .mc-prog { background: rgba(107,74,8,0.12); }
  .mc-inprogress .mc-prog { background: rgba(28,74,122,0.12); }
  .mc-hold .mc-prog { background: rgba(90,88,80,.15); }
  .mc-complete   .mc-prog { background: rgba(26,92,53,0.12); }

  .mc-prog-fill { height: 100%; border-radius: 99px; }
  .mc-pending    .mc-prog-fill { background: #D4A843; }
  .mc-inprogress .mc-prog-fill { background: #4A7FBF; }
  .mc-hold .mc-prog-fill { background: #9A9890; }
  .mc-complete   .mc-prog-fill { background: #3AA66A; }
}

</style>

<script type="module">
  import { supabase } from './js/supabase.js'

const COMPANY_ID = '4f365a63-e2d8-45ea-960a-67d35b5f95e1'

async function loadProjects() {
  const { data, error } = await supabase
    .from('project_summary')
    .select('*')
    .eq('company_id', COMPANY_ID)
    .order('created_at', { ascending: false })

  if (error) {
    console.error('Error loading projects:', error)
    return
  }

  projects = data.map(p => ({
    id: p.id,
    name: p.name,
    projectNum: p.project_num,
    location: p.location,
    client: p.client,
    notes: p.notes || '',
    status: mapStatus(p.status),
    pct: p.pct_complete,
    openTasks: (p.pending_tasks || 0) + (p.infield_tasks || 0),
    pendingTasks: p.pending_tasks || 0,
    infieldTasks: p.infield_tasks || 0,
    totalTasks: p.total_tasks || 0,
    updated: '',
    created: ''
  }))

  filterProjects()
}

function mapStatus(status) {
  if (status === 'pending') return 'Pending'
  if (status === 'on-hold') return 'On Hold'
  if (status === 'complete') return 'Complete'
  return 'In Progress'
}
  
// ═══════════════════════════════════════
// DATA
// ═══════════════════════════════════════
var projects = []
var nextId = 7;
var editTarget = null;
var deleteTarget = null;
var archiveTarget = null;
var notesTarget = null;
var openKebab = null;
var openSD = null;

var projectTasks = {
  1:{notes:'Gate code: #4521. Equipment staging in east parking lot.',tasks:[
    {site:1,desc:'Colorado & Fair Oaks',type:'TMC',tech:'Ava R.',status:'Complete',note:'48-hour count confirmed',deployed:'3/2 6:42a',picked:'3/3 7:15a',dur:'24h 33m'},
    {site:2,desc:'Colorado & Arroyo',type:'TMC',tech:'Ava R.',status:'Complete',note:'',deployed:'3/2 6:55a',picked:'3/3 7:22a',dur:'24h 27m'},
    {site:3,desc:'Union & Raymond',type:'TMC',tech:'Noah K.',status:'In Field',note:'Pole mount confirmed',deployed:'3/4 6:30a',picked:'',dur:''},
    {site:4,desc:'Fair Oaks & Green',type:'TMC',tech:'Noah K.',status:'In Field',note:'',deployed:'3/4 6:38a',picked:'',dur:''},
    {site:5,desc:'Walnut & Marengo',type:'ADT',tech:'Maya T.',status:'Pending',note:'',deployed:'',picked:'',dur:''}
  ]},
  2:{notes:'Tube counters only — no radar.',tasks:[
    {site:1,desc:'Harbor Blvd NB',type:'ADT',tech:'Leo S.',status:'In Field',note:'',deployed:'3/5 7:10a',picked:'',dur:''},
    {site:2,desc:'Harbor Blvd SB',type:'ADT',tech:'Leo S.',status:'In Field',note:'',deployed:'3/5 7:18a',picked:'',dur:''}
  ]},
  3:{notes:'',tasks:[{site:1,desc:'Ocean & Pine',type:'TMC',tech:'Sofia P.',status:'Complete',note:'',deployed:'2/26 6:00a',picked:'2/27 6:45a',dur:'24h 45m'}]},
  4:{notes:'Radar speed surveys near school zones.',tasks:[{site:1,desc:'Glenoaks & Pacific',type:'SPD',tech:'',status:'Pending',note:'',deployed:'',picked:'',dur:''}]},
  5:{notes:'',tasks:[{site:1,desc:'Foothill & Santa Anita',type:'TMC',tech:'Maya T.',status:'In Field',note:'',deployed:'3/3 5:45a',picked:'',dur:''}]},
  6:{notes:'Bikeway study complete.',tasks:[{site:1,desc:'Ocean Park Blvd',type:'CLS',tech:'Ava R.',status:'Complete',note:'',deployed:'2/18 6:20a',picked:'2/19 7:00a',dur:'24h 40m'}]}
};


// ═══════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════
function badgeClass(s) {
  return s === 'In Progress' ? 'badge-progress' : s === 'Pending' ? 'badge-pending' : s === 'On Hold' ? 'badge-hold' : 'badge-complete';
}

function getInitials(name) { if(!name) return '—'; return name.split(' ').map(function(p){return p[0]}).join('').toUpperCase(); }

function openProjectDetail(id) {
  window.location.href = 'project-detail.html?id=' + encodeURIComponent(id);
}



// ═══════════════════════════════════════
// RENDER — grouped by status
// ═══════════════════════════════════════
function renderProjects(list) {
  var sections = document.getElementById('projectSections');
  var footer = document.getElementById('tableFooter');
  var empty = document.getElementById('emptyState');

  if (projects.length === 0) {
    sections.innerHTML = '';
    footer.style.display = 'none';
    empty.classList.add('show');
    return;
  }

  empty.classList.remove('show');

  if (list.length === 0) {
    sections.innerHTML = '<div style="text-align:center;padding:60px 20px;color:var(--text-3)">No projects match your search</div>';
    footer.style.display = 'none';
    return;
  }

  var html = '';
  html += '<table><thead><tr>';
  html += '<th style="width:35%">Project</th>';
  html += '<th style="width:12%">Status</th>';
  html += '<th style="width:22%">Progress</th>';
  html += '<th style="width:8%" class="c">Open</th>';
  html += '<th style="width:8%" class="c">Done</th>';
  html += '<th style="width:4%"></th>';
  html += '</tr></thead><tbody>';

  list.forEach(function(p) {
    var complete = p.totalTasks - p.openTasks;
    var statusDropdown = '';
    var statusClick = '';
    var progressCell = '';

    if (p.status !== 'Complete') {
      statusClick = ' data-action="toggle-status" data-id="' + p.id + '" style="cursor:pointer"';
      statusDropdown = '<div class="status-dropdown" id="sd-' + p.id + '">' + getStatusOptions(p) + '</div>';
    }

    if (p.status === 'Complete') {

    }

    html += '<td style="position:relative"><span class="badge ' + badgeClass(p.status) + '"' + statusClick + '>' + p.status + '</span>' + statusDropdown + '</td>';
    html += '<td>' + progressCell + '</td>';
    html += '<td class="c"><span class="cell-num-open ' + (p.openTasks===0?'zero':'') + '">' + p.openTasks + '</span></td>';
    html += '<td class="c"><span class="cell-num-done">' + complete + '</span></td>';
    html += '<td class="r kebab-cell"><button class="kebab" data-action="toggle-kebab" data-id="' + p.id + '"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg></button>';

    html += '<button class="kebab-menu-item" data-action="edit" data-id="' + p.id + '"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>Edit</button>';
    html += '<button class="kebab-menu-item" data-action="notes" data-id="' + p.id + '"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>Tech Notes</button>';
    html += '<button class="kebab-menu-item" data-action="jobsheet" data-id="' + p.id + '"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>Job Sheet</button>';
    if (p.status === 'Complete') {
      html += '<button class="kebab-menu-item" data-action="archive" data-id="' + p.id + '"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8v13H3V8"/><path d="M1 3h22v5H1z"/><path d="M10 12h4"/></svg>Archive</button>';
    }
    html += '<button class="kebab-menu-item danger" data-action="delete" data-id="' + p.id + '"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>Delete</button>';
    html += '</div></td>';
    html += '</tr>';
  });

  html += '</tbody></table>';
  sections.innerHTML = html;

  sections.querySelectorAll('.project-row').forEach(function(row) {
    row.addEventListener('click', function(e) {
      if (e.target.closest('.kebab-cell')) return
      if (e.target.closest('.badge')) return
      if (e.target.closest('.status-dropdown')) return
      if (e.target.closest('.kebab-menu')) return

      openProjectDetail(row.dataset.projectId)
    })
  });

  var mList = document.getElementById('mobileProjectList');
  var mSub = document.getElementById('mobilePageSub');
  var active = projects.filter(function(p){ return p.status !== 'Complete' });
  var openTasks = active.reduce(function(s,p){ return s + p.openTasks }, 0);

  if (mSub) mSub.textContent = active.length + ' active · ' + openTasks + ' open tasks';

  if (mList) {
    var mHtml = '';
    list.forEach(function(p) {
      var done = p.totalTasks - p.openTasks;
      var s = p.status;

      var hasInfield  = p.infieldTasks > 0;
      var hasPending  = p.pendingTasks > 0;
      var hasActivity = hasInfield || done > 0;
      var isAllDone   = p.totalTasks > 0 && done === p.totalTasks;

      var cardClass = isAllDone || s === 'Complete' ? 'mc-complete'
                    : s === 'On Hold'               ? 'mc-hold'
                    : s === 'In Progress' && hasInfield ? 'mc-inprogress'
                    :                                  'mc-pending';

      var leftBadge   = '';
      var centerBadge = '';
      var rightBadge  = '';

      if (isAllDone || s === 'Complete') {
        // all done — no badges, clean card
      } else if (s === 'On Hold') {
        rightBadge = '<span class="mc-pill-sm mc-badge-hold"><span style="width:6px;height:6px;border-radius:50%;background:#9A9890;display:inline-block;flex-shrink:0;"></span> On Hold</span>';
      } else if (s === 'In Progress' && hasInfield) {
        leftBadge   = '<span class="mc-pill-sm mc-infield-pill"><span class="mc-blink"></span>' + p.infieldTasks + ' In Field</span>';
        if (hasPending) {
          rightBadge = '<span class="mc-pill-sm mc-pending-pill"><span class="mc-pd-dot"></span>' + p.pendingTasks + ' Pending</span>';
        }
      } else if (hasActivity && hasPending) {
        rightBadge = '<span class="mc-pill-sm mc-pending-pill"><span class="mc-pd-dot"></span>' + p.pendingTasks + ' Pending</span>';
      }
      // else: no activity at all — no badges, top bar omitted

      var showTopBar = leftBadge || centerBadge || rightBadge;

      var checkmark = isAllDone
        ? '<div class="mc-check"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#1A5C35" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></div>'
        : '';

      mHtml += '<div class="mc ' + cardClass + (showTopBar ? '' : ' mc-no-topbar') + '">';

      if (showTopBar) {
        mHtml += '<div class="mc-top-bar">';
        mHtml += '<div class="mc-top-left">'  + leftBadge   + '</div>';
        mHtml += '<div class="mc-top-mid">'   + centerBadge + '</div>';
        mHtml += '<div class="mc-top-right">' + rightBadge  + '</div>';
        mHtml += '</div>';
      }

      mHtml += '<div class="mc-name-row"><div class="mc-name">' + p.name + '</div>' + checkmark + '</div>';
      mHtml += '<div class="mc-city">' + (p.location || '') + '</div>';
      mHtml += '<div class="mc-divider"></div>';

      mHtml += '<div class="mc-counter"><span class="mc-done">' + done + '</span><span class="mc-slash">/</span><span class="mc-total">' + p.totalTasks + '</span></div>';
      mHtml += '<div class="mc-counter-label">Tasks Complete</div>';

      mHtml += '<button class="mc-pill" data-action="jobsheet" data-id="' + p.id + '"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>View Job Sheet</button>';
      mHtml += '<div class="mc-prog"><div class="mc-prog-fill" style="width:' + p.pct + '%"></div></div>';
      mHtml += '</div>';
    });
    mList.innerHTML = mHtml;
  }

  document.getElementById('projectCount').textContent = active.length + ' active';
  footer.style.display = '';
  footer.textContent = projects.length + ' projects · ' + openTasks + ' open tasks';
}

      p.name.toLowerCase().indexOf(search) > -1 ||

var dotClasses = {'Pending':'sd-pending','In Progress':'sd-in-progress','On Hold':'sd-on-hold','Complete':'sd-complete'};

function getStatusOptions(p) {
  var allowed;
  if (p.status === 'On Hold') {
    allowed = p.pct === 0 ? ['Pending'] : ['In Progress'];
  } else {
    var map = {
      'Pending': ['On Hold'],
      'In Progress': ['On Hold', 'Complete'],
      'Complete': []
    };
    allowed = map[p.status] || [];
  }

  return allowed.map(function(s) {
    return '<button class="status-dropdown-item" data-action="set-status" data-id="' + p.id + '" data-status="' + s + '"><span class="sd-dot ' + dotClasses[s] + '"></span>' + s + '</button>';
  }).join('');
}

async function setProjectStatus(id, status) {
  var dbStatusMap = {
    'Pending': 'pending',
    'On Hold': 'on-hold',
    'Complete': 'complete',
    'In Progress': 'active'
  }

  const { data, error } = await supabase
    .from('projects')
    .update({ status: dbStatusMap[status] || 'active' })
    .eq('id', id)

function toggleStatusDrop(id) {
  closeKebabs();
  if (openSD && openSD !== id) { var old = document.getElementById('sd-'+openSD); if(old) old.classList.remove('open'); }
  var dd = document.getElementById('sd-'+id);
  var isOpen = dd.classList.contains('open');
  dd.classList.remove('open');
  if (!isOpen) { dd.classList.add('open'); openSD = id; } else { openSD = null; }
}

function closeStatusDrops() {
  if (openSD) { var el = document.getElementById('sd-'+openSD); if(el) el.classList.remove('open'); openSD = null; }
}


// ═══════════════════════════════════════
// KEBAB
// ═══════════════════════════════════════
function toggleKebab(id, e) {
  if (e) {
    e.preventDefault()
    e.stopPropagation()
  }

  closeStatusDrops()

  if (openKebab && openKebab !== id) {
    var old = document.getElementById('kebab-' + openKebab)
    if (old) old.classList.remove('open', 'drop-up', 'drop-down')
  }

  var menu = document.getElementById('kebab-' + id)
  if (!menu) return

  var isOpen = menu.classList.contains('open')
  menu.classList.remove('open', 'drop-up', 'drop-down')

  if (!isOpen) {
    var rect = e.currentTarget.getBoundingClientRect()
    var spaceBelow = window.innerHeight - rect.bottom
    menu.classList.add('open', spaceBelow < 160 ? 'drop-up' : 'drop-down')
    openKebab = id
  } else {
    openKebab = null
  }
}

function closeKebabs() {
  if (openKebab) { var el = document.getElementById('kebab-'+openKebab); if(el) el.classList.remove('open','drop-up','drop-down'); openKebab = null; }
}

// ═══════════════════════════════════════
// JOB SHEET
// ═══════════════════════════════════════
async function openJobSheet(id) {
  closeKebabs()

  const { data: projectData, error: projectError } = await supabase
    .from('projects')
    .select('id, name, client, location, notes, project_num')
    .eq('id', id)
    .single()

  if (projectError || !projectData) {
    console.error('Error loading job sheet project:', projectError)
    alert(JSON.stringify(projectError))
    return
  }

  const { data: taskRows, error: taskError } = await supabase
    .from('tasks')
    .select(`
      *,
      study_types:study_type_id ( id, code, name ),
      users:tech_id ( id, first_name, last_name )
    `)
    .eq('project_id', id)
    .order('site', { ascending: true })

  if (taskError) {
    console.error('Error loading job sheet tasks:', taskError)
    alert(JSON.stringify(taskError))
    return
  }

  const taskIds = (taskRows || []).map(function(t){ return t.id })
  var cyclesByTask = {}

  if (taskIds.length) {
    const { data: cycleRows, error: cycleError } = await supabase
      .from('cycles')
      .select('*')
      .in('task_id', taskIds)
      .order('cycle_num', { ascending: false })

    if (cycleError) {
      console.error('Error loading job sheet cycles:', cycleError)
      alert(JSON.stringify(cycleError))
      return
    }

    ;(cycleRows || []).forEach(function(cycle) {
      if (!cyclesByTask[cycle.task_id]) cyclesByTask[cycle.task_id] = []
      cyclesByTask[cycle.task_id].push(cycle)
    })
  }

  function getStudyTypeCode(studyType) {
    if (!studyType) return 'OTH'
    return studyType.code || 'OTH'
  }

  function getTechName(user) {
    if (!user) return ''
    var first = user.first_name || ''
    var last = user.last_name || ''
    return [first, last ? last[0] + '.' : ''].filter(Boolean).join(' ').trim()
  }

  function getLatestCycle(taskId) {
    return cyclesByTask[taskId]?.[0] || null
  }

  function fmtTime(d) {
    if (!d) return ''
    var dt = new Date(d)
    var m = dt.getMonth() + 1
    var day = dt.getDate()
    var h = dt.getHours()
    var min = dt.getMinutes()
    var ampm = h >= 12 ? 'p' : 'a'
    h = h % 12 || 12
    return m + '/' + day + ' ' + h + ':' + (min < 10 ? '0' : '') + min + ampm
  }

  function fmtDur(ms) {
    if (!ms || ms < 0) return ''
    var totalHours = ms / 3600000
    if (totalHours >= 24) {
      var d = Math.floor(totalHours / 24)
      var h = Math.floor(totalHours % 24)
      return d + 'd ' + h + 'h'
    }
    var h = Math.floor(ms / 3600000)
    var m = Math.floor((ms % 3600000) / 60000)
    return h + 'h ' + m + 'm'
  }

  var tasks = (taskRows || []).map(function(row) {
    var cycle = getLatestCycle(row.id)
    var dur = ''

    if (cycle?.deployed_at && cycle?.completed_at) {
      dur = fmtDur(new Date(cycle.completed_at) - new Date(cycle.deployed_at))
    } else if (cycle?.deployed_at && row.status === 'in-field') {
      dur = fmtDur(Date.now() - new Date(cycle.deployed_at).getTime())
    }

    return {
      id: row.id,
      site: row.site,
      desc: row.description || '',
      type: getStudyTypeCode(row.study_types),
      tech: getTechName(row.users),
      status: row.status === 'pending' ? 'Pending' : row.status === 'complete' ? 'Complete' : 'In Field',
      note: row.notes || '',
      deployed: cycle?.deployed_at ? fmtTime(cycle.deployed_at) : '',
      picked: cycle?.completed_at ? fmtTime(cycle.completed_at) : '',
      dur: dur
    }
  })

  var now = new Date()
  var dateStr = (now.getMonth()+1) + '/' + now.getDate() + '/' + now.getFullYear()

  // project header
  var html = '<div class="js-project">'
  html += '<div class="js-project-name">' + projectData.name + '</div>'
  if (projectData.client || projectData.location) {
    html += '<div class="js-project-meta">' + [projectData.client, projectData.location].filter(Boolean).join(' · ') + '</div>'
  }
  if (projectData.project_num) {
    html += '<div class="js-project-num">Project #' + projectData.project_num + '</div>'
  }
  html += '</div>'

  // instructions
  if (projectData.notes) {
    html += '<div class="js-instructions-card">'
    html += '<div class="js-instructions-header"><span class="js-instructions-title">Instructions</span></div>'
    html += '<div class="js-instructions-body">' + projectData.notes + '</div>'
    html += '</div>'
  }

  var pending  = tasks.filter(function(t){ return t.status === 'Pending' })
  var infield  = tasks.filter(function(t){ return t.status === 'In Field' })
  var complete = tasks.filter(function(t){ return t.status === 'Complete' })

  function renderGroup(title, list, headerClass, dotClass, labelClass) {
    if (list.length === 0) return ''
    var s = '<div class="js-section">'
    s += '<div class="js-section-header ' + headerClass + '">'
    s += '<div class="js-section-left">'
    s += '<span class="js-section-dot ' + dotClass + '"></span>'
    s += '<span class="js-section-label">' + title + '</span>'
    s += '</div>'
    s += '<span class="js-section-count">' + list.length + '</span>'
    s += '</div>'
    s += '<div class="js-site-list">'
    list.forEach(function(t) {
      s += '<div class="js-site">'
      s += '<div class="js-site-header">'
      s += '<span class="js-site-num">#' + t.site + '</span>'
      s += '<span class="js-site-desc">' + t.desc + '</span>'
      s += '<div class="js-site-tags">'
      s += '<span class="js-site-tag">' + t.type + '</span>'
      if (t.tech) s += '<span class="js-site-tech-init">' + getInitials(t.tech) + '</span>'
      s += '</div>'
      s += '</div>'
      var times = []
      if (t.deployed) times.push('Set: ' + t.deployed)
      if (t.picked)   times.push('Pickup: ' + t.picked)
      if (t.dur)      times.push('Duration: ' + t.dur)
      if (times.length) s += '<div class="js-site-times">' + times.join(' · ') + '</div>'
      if (t.note) s += '<div class="js-site-note">' + t.note + '</div>'
      s += '</div>'
    })
    s += '</div></div>'
    return s
  }

  html += renderGroup('Pending',   pending,  'js-section-header-pending',  'js-section-dot-pending',  '')
  html += renderGroup('In Field',  infield,  'js-section-header-infield',  'js-section-dot-infield',  '')
  html += renderGroup('Complete',  complete, 'js-section-header-complete', 'js-section-dot-complete', '')

  // footer
  html += '<div class="js-footer">'
  html += 'Report generated ' + dateStr + ' · <span class="js-footer-brand">The Count Company</span>'
  html += '</div>'

  document.getElementById('jobsheetBody').innerHTML = '<div class="jobsheet-container">' + html + '</div>'
  document.getElementById('jobsheetOverlay').classList.add('visible')
  document.body.style.overflow = 'hidden'
}

function closeJobSheet() { document.getElementById('jobsheetOverlay').classList.remove('visible'); document.body.style.overflow = ''; }
function printJobSheet() {
  document.body.classList.add('printing-jobsheet');
  window.print();
  document.body.classList.remove('printing-jobsheet');
}

// Mobile nav

document.addEventListener('click',function(e){if(!e.target.closest('.m-kebab,.mobile-nav-menu')){var m=document.getElementById('mobileNavMenu');if(m)m.classList.remove('open')}});

document.getElementById('openCreateModalBtn')?.addEventListener('click', openCreateModal)

document.getElementById('closeEditModalBtn')?.addEventListener('click', closeEditModal)

document.getElementById('closeDeleteModalBtn')?.addEventListener('click', closeDeleteModal)

document.getElementById('confirmArchiveBtn')?.addEventListener('click', confirmArchive)

document.getElementById('printJobSheetBtn')?.addEventListener('click', printJobSheet)

document.getElementById('mobileNavToggle')?.addEventListener('click', function(e) {
  e.stopPropagation()
  toggleMobileNav()
})

document.getElementById('projectSections')?.addEventListener('click', function(e) {
  var actionEl = e.target.closest('[data-action]')
  if (!actionEl) return

  var action = actionEl.dataset.action
  var id = actionEl.dataset.id
  var status = actionEl.dataset.status

  if (actionEl.closest('.kebab-menu') || actionEl.closest('.kebab-cell') || actionEl.closest('.status-dropdown') || action === 'toggle-status') {
    e.stopPropagation()
  }

  if (action === 'toggle-kebab') return toggleKebab(id, e)
  if (action === 'edit') return openEditModal(id)
  if (action === 'notes') return openNotesModal(id)
  if (action === 'jobsheet') return openJobSheet(id)
  if (action === 'archive') return promptArchive(id)
  if (action === 'delete') return promptDelete(id)
  if (action === 'reopen') return reopenProject(id)
  if (action === 'toggle-status') return toggleStatusDrop(id)
  if (action === 'set-status') return setProjectStatus(id, status)
})

document.getElementById('mobileProjectList')?.addEventListener('click', function(e) {
  var actionEl = e.target.closest('[data-action]')
  if (!actionEl) return

  var action = actionEl.dataset.action
  var id = actionEl.dataset.id

  if (action === 'jobsheet') {
    e.stopPropagation()
    return openJobSheet(id)
  }

  if (action === 'open-project') {
    return openProjectDetail(id)
  }
})

</script>
