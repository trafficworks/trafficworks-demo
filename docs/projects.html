<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Projects — Mobile v2</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  /* From style.css */
  --bg:       #F4F3F0;
  --text:     #1A1D21;
  --text-2:   #6B7178;
  --text-3:   #7D838A;
  --line:     #DEDBD5;
  --line-light: #ECEAE4;
  --accent:   #3AA66A;
  --pending:  #D4A843;
  --infield:  #6A9BB8;
  --complete: #3AA66A;
  --hold:     #C45C5C;
  --font:     'DM Sans', sans-serif;

  /* Card color themes */
  --card-inprogress-bg: #E8F0FA;
  --card-inprogress-fg: #2C5F8A;
  --card-inprogress-accent: #6A9BB8;
  --card-inprogress-pill: rgba(44,95,138,0.12);

  --card-infield-bg: #E6F5EE;
  --card-infield-fg: #1D6644;
  --card-infield-accent: #3AA66A;
  --card-infield-pill: rgba(29,102,68,0.12);

  --card-pending-bg: #FDF6E3;
  --card-pending-fg: #7A5A10;
  --card-pending-accent: #D4A843;
  --card-pending-pill: rgba(122,90,16,0.12);

  --card-complete-bg: #1A1D21;
  --card-complete-fg: #ffffff;
  --card-complete-accent: #3AA66A;
  --card-complete-pill: rgba(255,255,255,0.12);
}

body {
  font-family: var(--font);
  background: var(--bg);
  min-height: 100vh;
  padding-bottom: 48px;
  -webkit-font-smoothing: antialiased;
}

/* ── NAV ── */
.nav {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 20px;
  padding: 28px 0 20px;
}
.nav a {
  font-size: 20px;
  font-weight: 600;
  color: var(--text-3);
  text-decoration: none;
  letter-spacing: -0.02em;
  transition: color 0.15s;
}
.nav a.active { color: var(--text); }
.nav-dot {
  width: 4px; height: 4px;
  border-radius: 50%;
  background: var(--line);
}

/* ── SECTION LABEL ── */
.section-label {
  padding: 0 18px 10px;
  font-size: 10.5px;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text-3);
}

/* ── CARDS ── */
.card-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding: 0 14px;
}

.proj-card {
  border-radius: 20px;
  padding: 22px 20px 18px;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  position: relative;
  transition: transform 0.12s;
}
.proj-card:active { transform: scale(0.983); }

/* Color themes */
.card-inprogress {
  background: var(--card-inprogress-bg);
  color: var(--card-inprogress-fg);
}
.card-infield {
  background: var(--card-infield-bg);
  color: var(--card-infield-fg);
}
.card-pending {
  background: var(--card-pending-bg);
  color: var(--card-pending-fg);
}
.card-complete {
  background: var(--card-complete-bg);
  color: var(--card-complete-fg);
}

/* status badge top-right */
.card-badge {
  position: absolute;
  top: 16px;
  right: 16px;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  padding: 4px 9px;
  border-radius: 100px;
}
.card-inprogress .card-badge { background: rgba(44,95,138,0.14); color: var(--card-inprogress-fg); }
.card-infield   .card-badge { background: rgba(29,102,68,0.14);  color: var(--card-infield-fg);   }
.card-pending   .card-badge { background: rgba(122,90,16,0.14);  color: var(--card-pending-fg);   }
.card-complete  .card-badge { background: rgba(58,166,106,0.22); color: var(--card-complete-accent); }

/* live dot for in-field */
.live-dot {
  display: inline-block;
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--card-infield-accent);
  margin-right: 4px;
  vertical-align: middle;
  animation: blink 1.8s ease-in-out infinite;
}
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }

.card-name {
  font-size: 15.5px;
  font-weight: 700;
  letter-spacing: -0.025em;
  line-height: 1.2;
  margin-bottom: 3px;
  padding: 0 36px 0 0; /* clear badge */
  align-self: flex-start;
  text-align: left;
}

.card-city {
  font-size: 12.5px;
  font-weight: 400;
  opacity: 0.65;
  margin-bottom: 20px;
  align-self: flex-start;
  text-align: left;
}

/* divider line */
.card-divider {
  width: 100%;
  height: 1px;
  margin-bottom: 18px;
}
.card-inprogress .card-divider { background: rgba(44,95,138,0.14); }
.card-infield    .card-divider { background: rgba(29,102,68,0.14); }
.card-pending    .card-divider { background: rgba(122,90,16,0.14); }
.card-complete   .card-divider { background: rgba(255,255,255,0.12); }

/* big task counter */
.counter-num {
  font-size: 58px;
  font-weight: 700;
  letter-spacing: -0.05em;
  line-height: 1;
  margin-bottom: 4px;
}
.counter-num .slash,
.counter-num .total {
  opacity: 0.35;
  font-weight: 400;
}
.card-complete .counter-num .done { color: var(--card-complete-accent); }

.counter-label {
  font-size: 10.5px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  opacity: 0.55;
  margin-bottom: 20px;
}

/* job sheet pill */
.job-pill {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 12px 22px;
  border-radius: 100px;
  font-family: var(--font);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  border: none;
  letter-spacing: -0.01em;
  transition: opacity 0.15s, transform 0.1s;
  width: 100%;
  justify-content: center;
}
.job-pill:active { opacity: 0.8; transform: scale(0.97); }

.card-inprogress .job-pill { background: rgba(44,95,138,0.13);  color: var(--card-inprogress-fg); }
.card-infield    .job-pill { background: rgba(29,102,68,0.13);  color: var(--card-infield-fg);   }
.card-pending    .job-pill { background: rgba(122,90,16,0.13);  color: var(--card-pending-fg);   }
.card-complete   .job-pill { background: rgba(255,255,255,0.12); color: #ffffff; }

/* progress bar */
.card-prog {
  width: 100%;
  height: 3px;
  border-radius: 99px;
  margin-top: 14px;
  overflow: hidden;
}
.card-inprogress .card-prog { background: rgba(44,95,138,0.15); }
.card-infield    .card-prog { background: rgba(29,102,68,0.15); }
.card-pending    .card-prog { background: rgba(122,90,16,0.15); }
.card-complete   .card-prog { background: rgba(255,255,255,0.1); }

.card-prog-fill {
  height: 100%;
  border-radius: 99px;
  transition: width 0.4s;
}
.card-inprogress .card-prog-fill { background: var(--card-inprogress-accent); }
.card-infield    .card-prog-fill { background: var(--card-infield-accent); }
.card-pending    .card-prog-fill { background: var(--card-pending-accent); }
.card-complete   .card-prog-fill { background: var(--card-complete-accent); }

/* ── MODAL (bottom sheet) ── */
.modal-overlay {
  display: none;
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.35);
  z-index: 200;
  align-items: flex-end;
  justify-content: center;
}
.modal-overlay.open { display: flex; }
.modal {
  background: #fff;
  border-radius: 24px 24px 0 0;
  padding: 28px 20px 40px;
  width: 100%;
  max-width: 480px;
}
.modal-title {
  font-size: 16px; font-weight: 700;
  letter-spacing: -0.02em;
  margin-bottom: 6px;
}
.modal-sub {
  font-size: 12px; color: var(--text-3);
  margin-bottom: 22px;
}
.form-label {
  display: block;
  font-size: 11px; font-weight: 600;
  letter-spacing: 0.07em;
  text-transform: uppercase;
  color: var(--text-3);
  margin-bottom: 7px;
}
.form-input {
  width: 100%;
  padding: 12px 14px;
  border: 1.5px solid var(--line);
  border-radius: 12px;
  font-family: var(--font);
  font-size: 15px;
  color: var(--text);
  background: var(--bg);
  outline: none;
  margin-bottom: 14px;
}
.form-input:focus { border-color: var(--text); }
.modal-actions { display: flex; gap: 10px; margin-top: 6px; }
.btn-cancel {
  flex: 1; padding: 14px;
  background: var(--bg); border: 1.5px solid var(--line);
  border-radius: 12px;
  font-family: var(--font); font-size: 14px; font-weight: 600;
  color: var(--text-2); cursor: pointer;
}
.btn-create {
  flex: 2; padding: 14px;
  background: var(--text); border: none;
  border-radius: 12px;
  font-family: var(--font); font-size: 14px; font-weight: 600;
  color: #fff; cursor: pointer;
}

/* demo wrapper */
</style>
</head>
<body>

  <!-- NAV: text links only -->
  <nav class="nav">
    <a href="#" class="active">Projects</a>
    <div class="nav-dot"></div>
    <a href="team.html">Team</a>
  </nav>

  <div class="section-label">4 active projects</div>

  <div class="card-list">

    <!-- IN PROGRESS — blue -->
    <div class="proj-card card-inprogress">
      <span class="card-badge">In Progress</span>
      <div class="card-name">Pasadena Intersection Study</div>
      <div class="card-city">Pasadena, CA</div>
      <div class="card-divider"></div>

      <button class="job-pill">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Download Job Sheet
      </button>

      <div class="counter-num">

      </div>
      <div class="counter-label">Tasks Complete</div>
      <button class="job-pill">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Download Job Sheet
      </button>
      <div class="card-prog"><div class="card-prog-fill" style="width:0%"></div></div>
    </div>

    <!-- PENDING — amber -->
    <div class="proj-card card-pending">
      <span class="card-badge">Pending</span>
      <div class="card-name">Glenoaks Speed Survey</div>
      <div class="card-city">Burbank, CA</div>
      <div class="card-divider"></div>
      <div class="counter-num">
        <span class="done">0</span><span class="slash">/</span><span class="total">4</span>
      </div>
      <div class="counter-label">Tasks Complete</div>
      <button class="job-pill">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Download Job Sheet
      </button>
      <div class="card-prog"><div class="card-prog-fill" style="width:0%"></div></div>

    <!-- COMPLETE — dark -->
    <div class="proj-card card-complete">

      <button class="job-pill">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Download Job Sheet
      </button>
      <div class="card-prog"><div class="card-prog-fill" style="width:100%"></div></div>
    </div>

  </div>

</body>
</html>
