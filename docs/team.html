<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Count Company — Team</title>

<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">

<style>
.kebab-menu.open { display:block; }
</style>
</head>

<body>

<div class="container main">

  <!-- MANAGERS -->
  <div class="team-section">
    <div class="section-header">
      <span class="section-label">Managers <span id="managerCount">0</span></span>
      <button class="btn-action" onclick="openAddModal('manager')">+ Add Manager</button>
    </div>
    <table>
      <thead>
        <tr>
          <th>Name</th>
          <th>Email</th>
          <th>Phone</th>
          <th>Status</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="managerTableBody"></tbody>
    </table>
  </div>

  <!-- TECHS -->
  <div class="team-section">
    <div class="section-header">
      <span class="section-label">Field Technicians <span id="techCount">0</span></span>
      <button class="btn-action" onclick="openAddModal('tech')">+ Add Tech</button>
    </div>
    <table>
      <thead>
        <tr>
          <th>Name</th>
          <th>Email</th>
          <th>Phone</th>
          <th>PIN</th>
          <th>Status</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="techTableBody"></tbody>
    </table>
  </div>

</div>

<script type="module">
import { supabase } from './js/supabase.js'

const COMPANY_ID = '4f365a63-e2d8-45ea-960a-67d35b5f95e1'

let managers = []
let techs = []

function fullName(p) {
  return [p.first_name, p.last_name].filter(Boolean).join(' ')
}

async function loadUsers() {
  const { data } = await supabase
    .from('users')
    .select('*')
    .eq('company_id', COMPANY_ID)

  managers = data.filter(u => u.role !== 'tech')
  techs = data.filter(u => u.role === 'tech')

  render()
}

function render() {
  renderManagers()
  renderTechs()
}

function renderManagers() {
  document.getElementById('managerCount').textContent = managers.length

  document.getElementById('managerTableBody').innerHTML = managers.map(m => `
    <tr>
      <td>${fullName(m)}</td>
      <td>${m.email || ''}</td>
      <td>${m.phone || ''}</td>
      <td>${m.status}</td>
      <td class="kebab-cell">
        <button class="kebab" onclick="toggleKebab('m','${m.id}',event)">•••</button>
        <div class="kebab-menu" id="kebab-m-${m.id}">
          <button class="kebab-menu-item" onclick="editMember('manager','${m.id}')">Edit</button>
        </div>
      </td>
    </tr>
  `).join('')
}

function renderTechs() {
  document.getElementById('techCount').textContent = techs.length

  document.getElementById('techTableBody').innerHTML = techs.map(t => `
    <tr>
      <td>${fullName(t)}</td>
      <td>${t.email || ''}</td>
      <td>${t.phone || ''}</td>
      <td>${t.pin || ''}</td>
      <td>${t.status}</td>
      <td class="kebab-cell">
        <button class="kebab" onclick="toggleKebab('t','${t.id}',event)">•••</button>
        <div class="kebab-menu" id="kebab-t-${t.id}">
          <button class="kebab-menu-item" onclick="toggleStatus('${t.id}')">
            ${t.status === 'active' ? 'Deactivate' : 'Activate'}
          </button>
        </div>
      </td>
    </tr>
  `).join('')
}


// ===============================
// FIX: KEBAB MENU
// ===============================
window.toggleKebab = function(type, id, e) {
  e.stopPropagation()

  const menu = document.getElementById(`kebab-${type}-${id}`)
  if (!menu) return

  document.querySelectorAll('.kebab-menu.open').forEach(m => {
    if (m !== menu) m.classList.remove('open')
  })

  menu.classList.toggle('open')
}

document.addEventListener('click', () => {
  document.querySelectorAll('.kebab-menu.open').forEach(m => {
    m.classList.remove('open')
  })
})


// ===============================
// FIX: STATUS TOGGLE
// ===============================
window.toggleStatus = async function(id) {
  const tech = techs.find(t => t.id === id)
  if (!tech) return

  const newStatus = tech.status === 'active' ? 'inactive' : 'active'

  await supabase
    .from('users')
    .update({ status: newStatus })
    .eq('id', id)

  tech.status = newStatus
  render()
}


// init
loadUsers()

</script>

</body>
</html>
