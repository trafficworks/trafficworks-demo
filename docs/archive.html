<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Count Company — Archive</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #F7F6F2; --surface: #FFFDFA; --surface-2: #F4F1EA; --surface-3: #FAF8F3;
  --text: #1F2933; --text-2: #5F6B76; --text-3: #74808A; --text-label: #6F7B84; --text-eyebrow: #7A868F;
  --line: #DDD8CF; --line-soft: #EBE6DE; --line-strong: #CFC8BC;
  --c-teal: #6F8F95; --c-teal-h: #4E6B70; --c-teal-lt: #DCE7E9;
  --c-olive: #7E8F63; --c-olive-h: #5E6B4A; --c-olive-lt: #E3E8DC;
  --c-amber: #D6A95C; --c-amber-h: #A8823F; --c-amber-lt: #F3E6C7;
  --font: 'Inter', ui-sans-serif, system-ui, sans-serif;
}
body { font-family: var(--font); background: var(--bg); color: var(--text); -webkit-font-smoothing: antialiased; min-height: 100vh; }

/* NAV */
nav { background: var(--surface); border-bottom: 1px solid var(--line); padding: 0 48px; height: 54px; display: flex; align-items: center; justify-content: space-between; }
.nav-brand { display: flex; align-items: center; gap: 9px; text-decoration: none; }
.nav-logo { width: 21px; height: 21px; border-radius: 50%; background: var(--c-teal); display: flex; align-items: center; justify-content: center; }
.nav-logo svg { width: 11px; height: 11px; }
.nav-name { font-size: 13px; font-weight: 700; color: var(--text); letter-spacing: -.01em; }
.nav-links { display: flex; }
.nav-links a { font-size: 12px; font-weight: 500; color: var(--text-3); text-decoration: none; padding: 0 14px; height: 54px; display: flex; align-items: center; border-bottom: 2px solid transparent; transition: color .15s; }
.nav-links a:hover { color: var(--text); }
.nav-links a.active { color: var(--text); border-bottom-color: var(--c-teal); }

/* PAGE */
.page { max-width: 900px; margin: 0 auto; padding: 32px 48px 80px; }
.page-eyebrow { font-size: 10px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; color: var(--text-eyebrow); margin-bottom: 4px; }
.page-title-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; padding-bottom: 14px; border-bottom: 1px solid var(--line); }
.page-title { font-size: 20px; font-weight: 700; letter-spacing: -.025em; color: var(--text); }

/* UPLOAD MODAL TRIGGER */
.btn-upload { height: 32px; padding: 0 14px; border: 1px solid var(--line); border-radius: 2px; background: var(--surface); font-family: var(--font); font-size: 11px; font-weight: 600; color: var(--text-2); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; transition: all .15s; letter-spacing: .03em; }
.btn-upload:hover { border-color: var(--line-strong); color: var(--text); }
.btn-upload svg { width: 12px; height: 12px; }

/* ARCHIVE PROJECT CARD */
.arc-card { background: var(--surface); border: 1px solid var(--line); border-radius: 2px; margin-bottom: 8px; }
.arc-card-header { display: flex; align-items: center; padding: 0 16px; height: 52px; cursor: pointer; user-select: none; gap: 12px; }
.arc-card-header:hover { background: var(--surface-2); }
.arc-name { font-size: 14px; font-weight: 700; color: var(--text); letter-spacing: -.01em; flex: 1; }
.arc-meta { font-size: 11px; color: var(--text-3); display: flex; align-items: center; gap: 16px; flex-shrink: 0; }
.arc-meta-item { display: flex; align-items: center; gap: 4px; }
.arc-archived-date { font-size: 10px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--text-3); }
.arc-chevron { font-size: 11px; color: var(--line-strong); transition: transform .2s; flex-shrink: 0; }
.arc-card.open .arc-chevron { transform: rotate(90deg); }

/* EXPAND PANEL */
.arc-panel { display: none; border-top: 1px solid var(--line-soft); }
.arc-card.open .arc-panel { display: block; }

/* TASK TABLE */
.arc-table-wrap { padding: 0; }
.arc-table { width: 100%; border-collapse: collapse; font-size: 12px; }
.arc-table th { padding: 8px 12px; background: var(--surface-2); color: var(--text-eyebrow); font-size: 9px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; border-bottom: 1px solid var(--line); text-align: left; }
.arc-table th:last-child { text-align: right; padding-right: 16px; }
.arc-table td { padding: 10px 12px; border-bottom: 1px solid var(--line-soft); vertical-align: middle; }
.arc-table tr:last-child td { border-bottom: none; }
.arc-table tbody tr:hover td { background: rgba(31,41,51,.018); }

.arc-task-num { font-size: 11px; color: var(--text-3); font-weight: 600; width: 32px; }
.arc-task-name { font-size: 13px; font-weight: 600; color: var(--text); }
.arc-task-type { display: inline-flex; align-items: center; padding: 3px 8px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 1px; font-size: 9px; font-weight: 700; letter-spacing: .06em; color: var(--text-label); }
.arc-reports-cell { text-align: right; padding-right: 16px; }

/* REPORT CHIPS */
.report-chips { display: inline-flex; align-items: center; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.report-chip { display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px; border-radius: 1px; font-size: 10px; font-weight: 600; letter-spacing: .04em; cursor: pointer; border: 1px solid var(--line); background: var(--surface-2); color: var(--text-2); text-decoration: none; transition: all .15s; white-space: nowrap; }
.report-chip:hover { border-color: var(--c-teal); color: var(--c-teal-h); background: var(--c-teal-lt); }
.report-chip svg { width: 11px; height: 11px; flex-shrink: 0; }
.report-chip.xlsx { color: var(--c-olive-h); background: var(--c-olive-lt); border-color: #A5B097; }
.report-chip.xlsx:hover { border-color: var(--c-olive-h); }
.report-chip.uploaded { color: var(--c-amber-h); background: var(--c-amber-lt); border-color: #E7C98A; }

/* GENERATE BUTTON */
.btn-generate { display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px; border-radius: 1px; font-size: 10px; font-weight: 600; letter-spacing: .04em; cursor: pointer; border: 1px solid var(--line); background: transparent; color: var(--text-3); transition: all .15s; font-family: var(--font); white-space: nowrap; }
.btn-generate:hover { border-color: var(--c-teal); color: var(--c-teal-h); }
.btn-generate svg { width: 11px; height: 11px; }

/* NO REPORT */
.no-report { font-size: 11px; color: var(--text-3); font-style: italic; }

/* PANEL FOOTER */
.arc-panel-footer { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; background: var(--surface-2); border-top: 1px solid var(--line-soft); }
.arc-footer-meta { font-size: 10px; color: var(--text-3); }
.arc-footer-actions { display: flex; align-items: center; gap: 8px; }
.btn-unarchive { height: 28px; padding: 0 12px; border: 1px solid var(--line); border-radius: 2px; background: transparent; font-family: var(--font); font-size: 10px; font-weight: 600; color: var(--text-3); cursor: pointer; transition: all .15s; letter-spacing: .04em; }
.btn-unarchive:hover { border-color: var(--line-strong); color: var(--text); }
.btn-upload-project { height: 28px; padding: 0 12px; border: 1px solid var(--line); border-radius: 2px; background: transparent; font-family: var(--font); font-size: 10px; font-weight: 600; color: var(--text-3); cursor: pointer; transition: all .15s; letter-spacing: .04em; display: inline-flex; align-items: center; gap: 5px; }
.btn-upload-project:hover { border-color: var(--c-teal); color: var(--c-teal-h); }

/* EMPTY STATE */
.empty-state { text-align: center; padding: 60px 20px; color: var(--text-3); }
.empty-state-icon { font-size: 32px; margin-bottom: 12px; opacity: .4; }
.empty-state-title { font-size: 14px; font-weight: 600; color: var(--text-2); margin-bottom: 6px; }
.empty-state-sub { font-size: 12px; }

/* UPLOAD MODAL */
.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(31,41,51,.4); z-index: 500; align-items: center; justify-content: center; opacity: 0; transition: opacity .18s; pointer-events: none; }
.modal-overlay.open { display: flex; opacity: 1; pointer-events: auto; }
.modal { background: var(--surface); border: 1px solid var(--line); border-radius: 2px; width: 480px; box-shadow: 0 8px 32px rgba(31,41,51,.12); animation: m-in .16s ease; }
@keyframes m-in { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:none} }
.modal-header { padding: 18px 20px 14px; border-bottom: 1px solid var(--line-soft); }
.modal-eyebrow { font-size: 9px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--text-eyebrow); margin-bottom: 4px; }
.modal-title { font-size: 15px; font-weight: 700; color: var(--text); letter-spacing: -.02em; }
.modal-body { padding: 18px 20px; }
.modal-actions { display: flex; justify-content: flex-end; gap: 8px; padding: 14px 20px; border-top: 1px solid var(--line-soft); }
.btn-ghost { height: 32px; padding: 0 14px; border: 1px solid var(--line); border-radius: 2px; background: var(--surface-2); font-family: var(--font); font-size: 11px; font-weight: 500; color: var(--text-2); cursor: pointer; }
.btn-solid { height: 32px; padding: 0 16px; border: 1px solid rgba(0,0,0,.1); border-radius: 2px; background: var(--c-teal); font-family: var(--font); font-size: 11px; font-weight: 700; color: #fff; cursor: pointer; letter-spacing: .03em; }
.btn-solid:hover { background: var(--c-teal-h); }

/* UPLOAD ZONE */
.upload-zone { border: 2px dashed var(--line); border-radius: 2px; padding: 28px 20px; text-align: center; cursor: pointer; transition: all .15s; background: var(--surface-2); }
.upload-zone:hover, .upload-zone.drag { border-color: var(--c-teal); background: var(--c-teal-lt); }
.upload-zone-icon { margin-bottom: 8px; color: var(--text-3); }
.upload-zone-icon svg { width: 28px; height: 28px; }
.upload-zone-title { font-size: 13px; font-weight: 600; color: var(--text-2); margin-bottom: 4px; }
.upload-zone-sub { font-size: 11px; color: var(--text-3); }
.upload-file-list { margin-top: 12px; display: flex; flex-direction: column; gap: 6px; }
.upload-file-item { display: flex; align-items: center; gap: 8px; padding: 8px 10px; background: var(--surface); border: 1px solid var(--line-soft); border-radius: 1px; font-size: 11px; color: var(--text-2); }
.upload-file-item svg { width: 13px; height: 13px; flex-shrink: 0; color: var(--c-teal); }
.upload-file-remove { margin-left: auto; background: none; border: none; cursor: pointer; color: var(--text-3); font-size: 14px; padding: 0 2px; }
.upload-file-remove:hover { color: #C45C5C; }

/* FIELD SELECTS */
.field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 12px; }
.field:last-child { margin-bottom: 0; }
.field-label { font-size: 9px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--text-eyebrow); }
.field-select, .field-input { height: 34px; border: 1px solid var(--line); border-radius: 2px; background: var(--surface); font-family: var(--font); font-size: 13px; color: var(--text); padding: 0 10px; outline: none; width: 100%; transition: border-color .15s; }
.field-select:focus, .field-input:focus { border-color: #C8A96A; }

/* LOADING */
.loading { text-align: center; padding: 40px; color: var(--text-3); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; }

/* TOAST */
.toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(8px); background: var(--text); color: #fff; border-radius: 2px; padding: 10px 18px; font-size: 12px; font-weight: 500; z-index: 800; opacity: 0; transition: all .2s; pointer-events: none; white-space: nowrap; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<nav>
  <a class="nav-brand" href="projects.html">
    <div class="nav-logo"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></div>
    <span class="nav-name">The Count Company</span>
  </a>
  <div class="nav-links">
    <a href="projects.html">Projects</a>
    <a href="team.html">Team</a>
    <a href="reports.html">Reports</a>
    <a href="archive.html" class="active">Archive</a>
  </div>
</nav>

<div class="page">
  <div class="page-eyebrow">The Count Company</div>
  <div class="page-title-row">
    <div class="page-title">Archive</div>
    <button class="btn-upload" onclick="openUploadModal()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
      Upload Report
    </button>
  </div>
  <div id="archiveList"><div class="loading">Loading archive…</div></div>
</div>

<!-- UPLOAD MODAL -->
<div class="modal-overlay" id="uploadModal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-eyebrow">Archive</div>
      <div class="modal-title">Upload Report</div>
    </div>
    <div class="modal-body">
      <div class="field">
        <label class="field-label">Project</label>
        <select class="field-select" id="uploadProject">
          <option value="">Select project…</option>
        </select>
      </div>
      <div class="field">
        <label class="field-label">Task / Site</label>
        <select class="field-select" id="uploadTask">
          <option value="">Select task…</option>
        </select>
      </div>
      <div class="field">
        <label class="field-label">Report Type</label>
        <select class="field-select" id="uploadType">
          <option value="ADT">ADT</option>
          <option value="TMC">TMC</option>
          <option value="SPD">Speed Survey</option>
          <option value="CLS">Classification</option>
          <option value="JOB_SHEET">Job Sheet</option>
          <option value="OTHER">Other</option>
        </select>
      </div>
      <div class="upload-zone" id="uploadZone" onclick="document.getElementById('uploadFileInput').click()">
        <div class="upload-zone-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        </div>
        <div class="upload-zone-title">Drop PDF or Excel here</div>
        <div class="upload-zone-sub">or click to browse · PDF and XLSX only</div>
      </div>
      <input type="file" id="uploadFileInput" accept=".pdf,.xlsx" style="display:none" multiple>
      <div class="upload-file-list" id="uploadFileList"></div>
    </div>
    <div class="modal-actions">
      <button class="btn-ghost" onclick="closeUploadModal()">Cancel</button>
      <button class="btn-solid" onclick="submitUpload()">Upload</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { supabase } from './js/supabase.js'

const COMPANY_ID = '4f365a63-e2d8-45ea-960a-67d35b5f95e1'

// ── STATE ──────────────────────────────────────────────────────────────────
let archivedProjects = []
let allTasks = {}
let allReports = {}
let uploadFiles = []
let openProjectId = null

// ── HELPERS ────────────────────────────────────────────────────────────────
function escapeHtml(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')
}

function showToast(msg) {
  const t = document.getElementById('toast')
  t.textContent = msg
  t.classList.add('show')
  setTimeout(() => t.classList.remove('show'), 2500)
}

function fmtDate(iso) {
  if (!iso) return '—'
  return new Date(iso).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })
}

function reportIcon(format) {
  if (format === 'xlsx') return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 9l6 6m0-6l-6 6"/></svg>`
  return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>`
}

// ── LOAD ARCHIVE ───────────────────────────────────────────────────────────
async function loadArchive() {
  const list = document.getElementById('archiveList')

  const { data: projects, error } = await supabase
    .from('projects')
    .select('*')
    .eq('company_id', COMPANY_ID)
    .not('archived_at', 'is', null)
    .order('archived_at', { ascending: false })

  if (error) { console.error(error); list.innerHTML = '<div class="loading">Error loading archive.</div>'; return }

  if (!projects.length) {
    list.innerHTML = `<div class="empty-state">
      <div class="empty-state-icon">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8v13H3V8"/><rect x="1" y="3" width="22" height="5"/><path d="M10 12h4"/></svg>
      </div>
      <div class="empty-state-title">No archived projects yet</div>
      <div class="empty-state-sub">Archived projects will appear here</div>
    </div>`
    return
  }

  archivedProjects = projects

  // Load all tasks and reports for these projects
  const projectIds = projects.map(p => p.id)

  const [tasksRes, reportsRes] = await Promise.all([
    supabase.from('tasks').select('*, study_types(code)').in('project_id', projectIds).order('site'),
    supabase.from('reports').select('*').in('project_id', projectIds).order('generated_at', { ascending: false })
  ])

  // Index by project
  if (tasksRes.data) {
    tasksRes.data.forEach(t => {
      if (!allTasks[t.project_id]) allTasks[t.project_id] = []
      allTasks[t.project_id].push(t)
    })
  }
  if (reportsRes.data) {
    reportsRes.data.forEach(r => {
      if (!allReports[r.task_id]) allReports[r.task_id] = []
      allReports[r.task_id].push(r)
    })
    // also index project-level reports (no task_id)
    reportsRes.data.filter(r => !r.task_id).forEach(r => {
      const key = 'proj_' + r.project_id
      if (!allReports[key]) allReports[key] = []
      allReports[key].push(r)
    })
  }

  renderArchive()
}

// ── RENDER ─────────────────────────────────────────────────────────────────
function renderArchive() {
  const list = document.getElementById('archiveList')
  list.innerHTML = archivedProjects.map(p => renderProjectCard(p)).join('')
}

function renderProjectCard(p) {
  const tasks = allTasks[p.id] || []
  const totalReports = tasks.reduce((s, t) => s + (allReports[t.id]||[]).length, 0)
    + (allReports['proj_' + p.id] || []).length

  return `<div class="arc-card" id="arc-${p.id}">
    <div class="arc-card-header" onclick="toggleProject('${p.id}')">
      <div class="arc-name">${escapeHtml(p.name)}</div>
      <div class="arc-meta">
        ${p.client ? `<span class="arc-meta-item">${escapeHtml(p.client)}</span>` : ''}
        ${p.project_num ? `<span class="arc-meta-item">#${escapeHtml(p.project_num)}</span>` : ''}
        <span class="arc-meta-item">${tasks.length} task${tasks.length !== 1 ? 's' : ''}</span>
        <span class="arc-meta-item">${totalReports} report${totalReports !== 1 ? 's' : ''}</span>
        <span class="arc-archived-date">Archived ${fmtDate(p.archived_at)}</span>
      </div>
      <span class="arc-chevron">›</span>
    </div>
    <div class="arc-panel" id="arc-panel-${p.id}">
      ${renderTaskTable(p, tasks)}
      <div class="arc-panel-footer">
        <span class="arc-footer-meta">${tasks.length} tasks · ${totalReports} reports · ${p.location || ''}</span>
        <div class="arc-footer-actions">
          <button class="btn-upload-project" onclick="openUploadModal('${p.id}')">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
            Upload Report
          </button>
          <button class="btn-unarchive" onclick="unarchiveProject('${p.id}')">Unarchive</button>
        </div>
      </div>
    </div>
  </div>`
}

function renderTaskTable(p, tasks) {
  if (!tasks.length) return `<div style="padding:16px 20px;font-size:12px;color:var(--text-3);font-style:italic">No tasks in this project.</div>`

  const rows = tasks.map(t => {
    const reports = allReports[t.id] || []
    const typeCode = t.study_types?.code || '—'

    const reportChips = reports.length
      ? reports.map(r => {
          const dlUrl = r.storage_path
            ? `javascript:downloadReport('${r.id}')`
            : `javascript:void(0)`
          return `<a class="report-chip${r.format === 'xlsx' ? ' xlsx' : ''}${r.uploaded ? ' uploaded' : ''}"
            href="${dlUrl}" title="${escapeHtml(r.filename)}">
            ${reportIcon(r.format)}
            ${r.type} ${r.format.toUpperCase()}${r.uploaded ? ' ↑' : ''}
          </a>`
        }).join('')
      : `<span class="no-report">No reports</span>`

    const genBtn = `<button class="btn-generate" onclick="openReport('${t.study_types?.code||''}','${t.id}','${p.id}')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="15" x2="8" y2="15"/><line x1="12" y1="11" x2="8" y2="11"/></svg>
      Generate
    </button>`

    return `<tr>
      <td class="arc-task-num">${t.site}</td>
      <td><span class="arc-task-name">${escapeHtml(t.description)}</span></td>
      <td><span class="arc-task-type">${escapeHtml(typeCode)}</span></td>
      <td class="arc-reports-cell">
        <div class="report-chips">
          ${reportChips}
          ${genBtn}
        </div>
      </td>
    </tr>`
  }).join('')

  return `<div class="arc-table-wrap">
    <table class="arc-table">
      <thead>
        <tr>
          <th style="width:36px">#</th>
          <th>Task</th>
          <th style="width:80px">Type</th>
          <th style="width:300px;text-align:right;padding-right:16px">Reports</th>
        </tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>
  </div>`
}

// ── TOGGLE ─────────────────────────────────────────────────────────────────
function toggleProject(id) {
  const card = document.getElementById('arc-' + id)
  card.classList.toggle('open')
}
window.toggleProject = toggleProject

// ── UNARCHIVE ──────────────────────────────────────────────────────────────
async function unarchiveProject(id) {
  const { error } = await supabase
    .from('projects')
    .update({ archived_at: null, archived_by: null })
    .eq('id', id)

  if (error) { console.error(error); return }

  archivedProjects = archivedProjects.filter(p => p.id !== id)
  delete allTasks[id]
  renderArchive()
  showToast('Project restored to Projects')
}
window.unarchiveProject = unarchiveProject

// ── OPEN REPORT GENERATOR ─────────────────────────────────────────────────
function openReport(type, taskId, projectId) {
  const tasks = allTasks[projectId] || []
  const task  = tasks.find(t => t.id === taskId) || {}
  const proj  = archivedProjects.find(p => p.id === projectId) || {}

  const params = new URLSearchParams({
    location: task.description || '',
    city:     proj.location    || '',
    project:  proj.project_num || '',
    client:   proj.client      || '',
    type:     type
  })

  const map = { TMC: 'TMC_Report_Generator.html', SPD: 'SPD_Report_Generator.html', ADT: 'ADT_Report_Generator.html', CLS: 'CLS_Report_Generator.html' }
  window.open((map[type] || 'ADT_Report_Generator.html') + '?' + params.toString(), '_blank')
}
window.openReport = openReport

// ── DOWNLOAD REPORT ───────────────────────────────────────────────────────
async function downloadReport(reportId) {
  const report = Object.values(allReports).flat().find(r => r.id === reportId)
  if (!report?.storage_path) { showToast('No file stored'); return }

  const { data, error } = await supabase.storage
    .from('reports')
    .createSignedUrl(report.storage_path, 60)

  if (error) { console.error(error); showToast('Download failed'); return }
  window.open(data.signedUrl, '_blank')
}
window.downloadReport = downloadReport

// ── UPLOAD MODAL ──────────────────────────────────────────────────────────
async function openUploadModal(preselectedProjectId = null) {
  uploadFiles = []
  document.getElementById('uploadFileList').innerHTML = ''
  document.getElementById('uploadTask').innerHTML = '<option value="">Select task…</option>'

  // populate project dropdown with archived projects
  const sel = document.getElementById('uploadProject')
  sel.innerHTML = '<option value="">Select project…</option>'
  archivedProjects.forEach(p => {
    const opt = document.createElement('option')
    opt.value = p.id
    opt.textContent = p.name + (p.project_num ? ` (#${p.project_num})` : '')
    sel.appendChild(opt)
  })

  if (preselectedProjectId) {
    sel.value = preselectedProjectId
    await loadUploadTasks(preselectedProjectId)
  }

  document.getElementById('uploadModal').classList.add('open')
}
window.openUploadModal = openUploadModal

function closeUploadModal() {
  document.getElementById('uploadModal').classList.remove('open')
  uploadFiles = []
}
window.closeUploadModal = closeUploadModal

document.getElementById('uploadProject')?.addEventListener('change', async function() {
  await loadUploadTasks(this.value)
})

async function loadUploadTasks(projectId) {
  const sel = document.getElementById('uploadTask')
  sel.innerHTML = '<option value="">All tasks / project-level</option>'
  if (!projectId) return
  const tasks = allTasks[projectId] || []
  tasks.forEach(t => {
    const opt = document.createElement('option')
    opt.value = t.id
    opt.textContent = `#${t.site} — ${t.description}`
    sel.appendChild(opt)
  })
}

// File input
document.getElementById('uploadFileInput')?.addEventListener('change', function() {
  handleFiles(Array.from(this.files))
})

// Drag and drop
const zone = document.getElementById('uploadZone')
zone?.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('drag') })
zone?.addEventListener('dragleave', () => zone.classList.remove('drag'))
zone?.addEventListener('drop', e => {
  e.preventDefault()
  zone.classList.remove('drag')
  handleFiles(Array.from(e.dataTransfer.files))
})

function handleFiles(files) {
  const valid = files.filter(f => f.type === 'application/pdf' || f.name.endsWith('.xlsx'))
  uploadFiles.push(...valid)
  renderFileList()
}

function renderFileList() {
  const list = document.getElementById('uploadFileList')
  list.innerHTML = uploadFiles.map((f, i) => `
    <div class="upload-file-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
      <span>${escapeHtml(f.name)}</span>
      <span style="margin-left:4px;color:var(--text-3);font-size:10px">${(f.size/1024).toFixed(0)} KB</span>
      <button class="upload-file-remove" onclick="removeFile(${i})">×</button>
    </div>`).join('')
}

function removeFile(idx) {
  uploadFiles.splice(idx, 1)
  renderFileList()
}
window.removeFile = removeFile

async function submitUpload() {
  const projectId = document.getElementById('uploadProject').value
  const taskId    = document.getElementById('uploadTask').value
  const type      = document.getElementById('uploadType').value

  if (!projectId) { showToast('Please select a project'); return }
  if (!uploadFiles.length) { showToast('Please select a file'); return }

  const proj = archivedProjects.find(p => p.id === projectId)

  for (const file of uploadFiles) {
    const ext      = file.name.endsWith('.xlsx') ? 'xlsx' : 'pdf'
    const safeName = file.name.replace(/[^a-z0-9.\-_]/gi, '_')
    const path     = `${COMPANY_ID}/${projectId}/${Date.now()}_${safeName}`

    const { error: upErr } = await supabase.storage
      .from('reports')
      .upload(path, file, { contentType: file.type, upsert: false })

    if (upErr) { console.error(upErr); showToast('Upload failed: ' + upErr.message); continue }

    const record = {
      company_id:   COMPANY_ID,
      project_id:   projectId,
      task_id:      taskId || null,
      type,
      format:       ext,
      filename:     file.name,
      storage_path: path,
      uploaded:     true,
    }

    const { data: rep, error: dbErr } = await supabase.from('reports').insert(record).select().single()
    if (dbErr) { console.error(dbErr); continue }

    // Update local state
    const key = taskId || ('proj_' + projectId)
    if (!allReports[key]) allReports[key] = []
    allReports[key].unshift(rep)

    // Mark task has_report
    if (taskId) {
      await supabase.from('tasks').update({ has_report: true }).eq('id', taskId)
    }
  }

  closeUploadModal()
  renderArchive()
  showToast(`${uploadFiles.length} file${uploadFiles.length > 1 ? 's' : ''} uploaded`)
  uploadFiles = []
}
window.submitUpload = submitUpload

// ── INIT ──────────────────────────────────────────────────────────────────
await loadArchive()

// Click outside modal to close
document.getElementById('uploadModal')?.addEventListener('click', function(e) {
  if (e.target === this) closeUploadModal()
})

</script>
