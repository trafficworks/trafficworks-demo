<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Count Company</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }

  .login {
    width: 100%;
    max-width: 360px;
    padding: 0 20px;
  }

  .login-brand {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 32px;
  }

  .login-logo {
    width: 32px; height: 32px; border-radius: 50%;
    background: var(--accent);
    display: flex; align-items: center; justify-content: center;
  }

  .login-logo svg { width: 16px; height: 16px; }

  .login-name {
    font-size: 18px;
    font-weight: 700;
    color: var(--text);
    letter-spacing: -0.5px;
  }

  .login-title {
    font-size: 22px;
    font-weight: 700;
    color: var(--text);
    letter-spacing: -0.5px;
    margin-bottom: 4px;
  }

  .login-sub {
    font-size: 14px;
    color: var(--text-3);
    margin-bottom: 24px;
  }

  .login-group { margin-bottom: 14px; }

  .login-label {
    display: block;
    font-size: 12px;
    font-weight: 500;
    color: var(--text-2);
    margin-bottom: 4px;
  }

  .login-input {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 4px;
    background: transparent;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    color: var(--text);
    outline: none;
    transition: border-color .15s;
  }

  .login-input:focus { border-color: var(--text-3); }
  .login-input::placeholder { color: var(--text-3); }

  .login-btn {
    width: 100%;
    padding: 11px;
    border: none;
    border-radius: 4px;
    background: var(--text);
    color: var(--bg);
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity .15s;
    margin-top: 8px;
  }

  .login-btn:hover { opacity: 0.85; }

  .login-divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 20px 0;
    color: var(--text-3);
    font-size: 12px;
  }

  .login-divider::before,
  .login-divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--line);
  }

  .login-pin-btn {
    width: 100%;
    padding: 10px;
    border: 1px solid var(--line);
    border-radius: 4px;
    background: transparent;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 500;
    color: var(--text-2);
    cursor: pointer;
    transition: all .15s;
  }

  .login-pin-btn:hover {
    border-color: var(--text-3);
    color: var(--text);
  }

  .login-footer {
    text-align: center;
    margin-top: 24px;
    font-size: 12px;
    color: var(--text-3);
  }

  .login-footer a {
    color: var(--text-2);
    text-decoration: none;
    font-weight: 500;
  }

  .login-footer a:hover { color: var(--text); }
</style>
</head>
<body>

<div class="login">
  <div class="login-brand">
    <div class="login-logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
    </div>
    <span class="login-name">The Count Company</span>
  </div>

  <div class="login-title">Sign in</div>
  <div class="login-sub">Manage your traffic data projects</div>

  <div class="login-group">
    <label class="login-label">Email</label>
    <input class="login-input" type="email" placeholder="you@company.com" id="loginEmail">
  </div>

  <div class="login-group">
    <label class="login-label">Password</label>
    <input class="login-input" type="password" placeholder="••••••••" id="loginPassword">
  </div>

  <button class="login-btn" onclick="window.location.href='projects.html'">Sign In</button>

  <div class="login-divider">or</div>

  <button class="login-pin-btn" onclick="window.location.href='projects.html'">Sign in with Tech PIN</button>

  <div class="login-footer">
    Don't have an account? <a href="#">Get started</a>
  </div>
</div>

</body>
</html>
