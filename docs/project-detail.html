<script type="module">
import { supabase } from './js/supabase.js'

const STATUS = { PENDING: 'Pending', INFIELD: 'In Field', COMPLETE: 'Complete' }

const state = {
  companyId: '4f365a63-e2d8-45ea-960a-67d35b5f95e1',
  projectId: new URLSearchParams(window.location.search).get('id'),
  project: null,
  tasks: [],
  techs: [],
  studyTypes: [],
  cyclesByTask: {},
  deleteTarget: null,
  reopenTarget: null,
  openKebab: null,
  currentSort: 'site'
}

if (!state.projectId) {
  document.getElementById('projectTitle').textContent = 'Project not found'
  document.getElementById('taskSections').innerHTML = '<div style="text-align:center;padding:60px 20px;color:var(--text-3)">Missing project id.</div>'
  throw new Error('Missing project id in URL')
}

function mapTaskStatus(status) {
  if (status === 'pending') return STATUS.PENDING
  if (status === 'complete') return STATUS.COMPLETE
  return STATUS.INFIELD
}

function mapDbStatus(label) {
  if (label === STATUS.PENDING) return 'pending'
  if (label === STATUS.COMPLETE) return 'complete'
  return 'in-field'
}

function getStudyTypeCode(studyType) {
  if (!studyType) return 'OTH'
  if (studyType.code) return studyType.code
  return 'OTH'
}

function getTechName(user) {
  if (!user) return ''
  const first = user.first_name || ''
  const last = user.last_name || ''
  return [first, last ? last[0] + '.' : ''].filter(Boolean).join(' ').trim()
}

function getInitials(name) {
  if (!name) return '—'
  return name.split(' ').map(part => part[0]).join('').toUpperCase()
}

function fmtTime(d) {
  if (!d) return ''
  const dt = new Date(d)
  const m = dt.getMonth() + 1
  const day = dt.getDate()
  let h = dt.getHours()
  const min = dt.getMinutes()
  const ampm = h >= 12 ? 'p' : 'a'
  h = h % 12 || 12
  return m + '/' + day + ' ' + h + ':' + (min < 10 ? '0' : '') + min + ampm
}

function fmtDur(ms) {
  if (!ms || ms < 0) return ''
  const totalHours = ms / 3600000
  if (totalHours >= 24) {
    const d = Math.floor(totalHours / 24)
    const h = Math.floor(totalHours % 24)
    return d + 'd ' + h + 'h'
  }
  const h = Math.floor(ms / 3600000)
  const m = Math.floor((ms % 3600000) / 60000)
  return h + 'h ' + m + 'm'
}

function getLatestCycle(taskId) {
  return state.cyclesByTask[taskId]?.[0] || null
}

function getDuration(task) {
  const cycle = getLatestCycle(task.id)
  if (!cycle || !cycle.deployed_at) return ''
  if (task.statusLabel === STATUS.INFIELD) return fmtDur(Date.now() - new Date(cycle.deployed_at).getTime())
  if (task.statusLabel === STATUS.COMPLETE && cycle.completed_at) {
    return fmtDur(new Date(cycle.completed_at).getTime() - new Date(cycle.deployed_at).getTime())
  }
  return ''
}

function badgeClass(s) {
  return s === STATUS.PENDING ? 'badge-pending' : s === STATUS.INFIELD ? 'badge-infield' : 'badge-complete'
}

function showToast(msg) {
  const el = document.getElementById('toast')
  el.textContent = msg
  el.classList.add('visible')
  clearTimeout(el._timer)
  el._timer = setTimeout(() => el.classList.remove('visible'), 2500)
}

function openModal(id) {
  document.getElementById(id).classList.add('visible')
}

function closeModal(id) {
  document.getElementById(id).classList.remove('visible')
}

function getFilteredTasks() {
  const s = (document.getElementById('searchInput').value || '').toLowerCase()
  return state.tasks.filter(t => {
    return !s ||
      t.desc.toLowerCase().includes(s) ||
      (t.type || '').toLowerCase().includes(s) ||
      (t.tech || '').toLowerCase().includes(s)
  })
}

function sortTasks(list) {
  const sorted = [...list]
  if (state.currentSort === 'tech') sorted.sort((a, b) => (a.tech || 'zzz').localeCompare(b.tech || 'zzz'))
  else if (state.currentSort === 'status') {
    const order = { [STATUS.PENDING]: 0, [STATUS.INFIELD]: 1, [STATUS.COMPLETE]: 2 }
    sorted.sort((a, b) => order[a.statusLabel] - order[b.statusLabel])
  } else if (state.currentSort === 'type') sorted.sort((a, b) => (a.type || '').localeCompare(b.type || ''))
  else sorted.sort((a, b) => a.site - b.site)
  return sorted
}

function renderStats() {
  const total = state.tasks.length
  const comp = state.tasks.filter(t => t.statusLabel === STATUS.COMPLETE).length

  const statsRow = document.getElementById('statsRow')
  if (statsRow) statsRow.innerHTML = ''

  const ms = document.getElementById('mobileStats')
  if (ms) ms.innerHTML = ''

  const mp = document.getElementById('mobileProgress')
  if (mp) mp.innerHTML = ''

  document.getElementById('tableFooter').textContent = total + ' tasks · ' + (total - comp) + ' open'
}

function renderTable() {
  const filtered = sortTasks(getFilteredTasks())
  const sections = document.getElementById('taskSections')

  if (filtered.length === 0) {
    sections.innerHTML = '<div style="text-align:center;padding:60px 20px;color:var(--text-3)">No tasks match your search</div>'
    document.getElementById('mobileTaskList').innerHTML = ''
    return
  }

  let html = ''
  html += '<table><thead><tr>'
  html += '<th style="width:6%">#</th>'
  html += '<th style="width:38%">Task</th>'
  html += '<th style="width:10%">Type</th>'
  html += '<th style="width:12%">Tech</th>'
  html += '<th style="width:12%">Status</th>'
  html += '<th style="width:12%">Duration</th>'
  html += '<th style="width:4%"></th>'
  html += '</tr></thead><tbody>'

  filtered.forEach(t => {
    const dur = getDuration(t)
    const initials = getInitials(t.tech)
    const latestCycle = getLatestCycle(t.id)
    const reopenNote = latestCycle && latestCycle.notes ? '<div class="cell-reopen">' + latestCycle.notes + '</div>' : ''
    const noteHtml = t.note ? '<div class="cell-note">' + t.note + '</div>' : ''

    html += '<tr id="row-' + t.id + '">'
    html += '<td><span class="site-num">' + t.site + '</span></td>'
    html += '<td><div class="cell-name">' + escapeHtml(t.desc) + '</div>' + reopenNote + noteHtml + '<input class="edit-input" value="' + escapeAttr(t.desc) + '" data-action="save-edit" data-id="' + t.id + '"></td>'
    html += '<td><span class="type-pill">' + escapeHtml(t.type) + '</span></td>'
    html += '<td><div class="tech-select-wrapper"><span class="tech-avatar ' + (t.tech ? 'assigned' : 'unassigned') + '" data-action="show-tech" data-id="' + t.id + '">' + initials + '<span class="tech-tooltip">' + escapeHtml(t.tech || 'Unassigned') + '</span></span></div></td>'
    html += '<td><span class="badge ' + badgeClass(t.statusLabel) + '">' + t.statusLabel + '</span></td>'
    html += '<td><span class="cell-duration">' + (dur || '—') + '</span></td>'
    html += '<td class="r kebab-cell"><button class="kebab" data-action="toggle-kebab" data-id="' + t.id + '"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg></button>'
    html += '<div class="kebab-menu" id="kebab-' + t.id + '">'
    html += '<button class="kebab-menu-item" data-action="edit-task" data-id="' + t.id + '"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>Edit</button>'
    if (t.statusLabel === STATUS.COMPLETE) html += '<button class="kebab-menu-item" data-action="reopen-task" data-id="' + t.id + '"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9"/><polyline points="3 3 3 7 7 7"/></svg>Reopen</button>'
    html += '<button class="kebab-menu-item danger" data-action="delete-task" data-id="' + t.id + '"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>Delete</button>'
    html += '</div></td>'
    html += '</tr>'
  })

  html += '</tbody></table>'
  sections.innerHTML = html

  const mTasks = document.getElementById('mobileTaskList')
  let mHtml = ''
  const mBadgeMap = { [STATUS.PENDING]: 'm-badge-pending', [STATUS.INFIELD]: 'm-badge-infield', [STATUS.COMPLETE]: 'm-badge-complete' }
  const mLabelMap = { [STATUS.PENDING]: 'Pending', [STATUS.INFIELD]: 'In Field', [STATUS.COMPLETE]: 'Done' }

  filtered.forEach(t => {
    const dur = getDuration(t)
    const noteHtml = t.note ? '<div class="m-task-note">' + escapeHtml(t.note) + '</div>' : ''
    mHtml += '<div class="m-task-row' + (t.statusLabel === STATUS.COMPLETE ? ' done' : '') + '">'
    mHtml += '<div class="m-task-left">'
    mHtml += '<div class="m-task-name">' + escapeHtml(t.desc) + '</div>'
    mHtml += '<div class="m-task-meta">#' + t.site + ' <span class="sep">·</span> <span class="m-task-type">' + escapeHtml(t.type) + '</span>' + (dur ? ' <span class="sep">·</span> ' + dur : '') + '</div>'
    mHtml += noteHtml
    mHtml += '</div>'
    mHtml += '<span class="m-task-badge ' + mBadgeMap[t.statusLabel] + '">' + mLabelMap[t.statusLabel] + '</span>'
    mHtml += '</div>'
  })
  mTasks.innerHTML = mHtml
}

function render() {
  renderStats()
  renderTable()
}

function escapeHtml(str) {
  return String(str ?? '').replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;')
}

function escapeAttr(str) {
  return escapeHtml(str).replaceAll('"', '&quot;')
}

async function loadProject() {
  const { data, error } = await supabase
    .from('projects')
    .select('*')
    .eq('id', state.projectId)
    .single()

  if (error || !data) {
    document.getElementById('projectTitle').textContent = 'Project not found'
    document.getElementById('taskSections').innerHTML = '<div style="text-align:center;padding:60px 20px;color:var(--text-3)">Could not load project.</div>'
    console.error('Error loading project:', error)
    return
  }

  state.project = data
  state.companyId = data.company_id
  document.getElementById('projectTitle').textContent = data.name || 'Untitled Project'
  document.getElementById('projectMeta').textContent = [data.client || '', data.location || ''].filter(Boolean).join(' · ')
}

async function loadStudyTypes() {
  const { data, error } = await supabase
    .from('study_types')
    .select('id, code, name, sort_order')
    .eq('company_id', state.companyId)
    .eq('is_active', true)
    .order('sort_order', { ascending: true })

  if (error) {
    console.error('Error loading study types:', error)
    return
  }

  state.studyTypes = data || []
  const sel = document.getElementById('newTaskType')
  sel.innerHTML = ''
  state.studyTypes.forEach(st => {
    const opt = document.createElement('option')
    opt.value = st.id
    opt.textContent = st.code
    sel.appendChild(opt)
  })
}

async function loadTechs() {
  const { data, error } = await supabase
    .from('users')
    .select('id, first_name, last_name, role')
    .eq('company_id', state.companyId)
    .eq('status', 'active')

  if (error) {
    console.error('Error loading techs:', error)
    return
  }

  state.techs = (data || []).filter(u => u.role === 'tech')
  const techSel = document.getElementById('newTaskTech')
  techSel.innerHTML = '<option value="">Unassigned</option>'
  state.techs.forEach(t => {
    const opt = document.createElement('option')
    opt.value = t.id
    opt.textContent = getTechName(t)
    techSel.appendChild(opt)
  })
}

async function loadTasks() {
  const { data, error } = await supabase
    .from('tasks')
    .select(`
      *,
      study_types:study_type_id ( id, code, name ),
      users:tech_id ( id, first_name, last_name )
    `)
    .eq('project_id', state.projectId)
    .order('site', { ascending: true })

  if (error) {
    console.error('Error loading tasks:', error)
    document.getElementById('taskSections').innerHTML = '<div style="text-align:center;padding:60px 20px;color:var(--text-3)">Could not load tasks.</div>'
    return
  }

  const rows = data || []
  state.tasks = rows.map(row => ({
    id: row.id,
    site: row.site,
    desc: row.description || '',
    type: getStudyTypeCode(row.study_types),
    studyTypeId: row.study_type_id,
    techId: row.tech_id,
    tech: getTechName(row.users),
    status: row.status,
    statusLabel: mapTaskStatus(row.status),
    note: row.notes || '',
    reopenReason: row.reopen_reason || ''
  }))

  const taskIds = state.tasks.map(t => t.id)
  state.cyclesByTask = {}

  if (taskIds.length) {
    const { data: cycles, error: cyclesError } = await supabase
      .from('cycles')
      .select('*')
      .in('task_id', taskIds)
      .order('cycle_num', { ascending: false })

    if (cyclesError) {
      console.error('Error loading cycles:', cyclesError)
    } else {
      ;(cycles || []).forEach(cycle => {
        if (!state.cyclesByTask[cycle.task_id]) state.cyclesByTask[cycle.task_id] = []
        state.cyclesByTask[cycle.task_id].push(cycle)
      })
    }
  }

  render()
}

async function loadAll() {
  await loadProject()
  if (!state.project) return
  await Promise.all([loadStudyTypes(), loadTechs()])
  await loadTasks()
}

function openAddTaskModal() {
  openModal('addTaskModal')
  switchTab('manual')
  document.getElementById('newTaskDesc').value = ''
  setTimeout(() => document.getElementById('newTaskDesc').focus(), 50)
}

function closeAddTaskModal() {
  closeModal('addTaskModal')
}

function switchTab(tab) {
  document.getElementById('manualTab').style.display = tab === 'manual' ? 'block' : 'none'
  document.getElementById('bulkTab').style.display = tab === 'bulk' ? 'block' : 'none'
  document.getElementById('tabManual').classList.toggle('active', tab === 'manual')
  document.getElementById('tabBulk').classList.toggle('active', tab === 'bulk')
}

async function addTask() {
  const desc = document.getElementById('newTaskDesc').value.trim()
  const studyTypeId = document.getElementById('newTaskType').value
  const techId = document.getElementById('newTaskTech').value || null

  if (!desc) {
    document.getElementById('newTaskDesc').focus()
    return
  }

  const nextSite = (Math.max(0, ...state.tasks.map(t => t.site || 0)) || 0) + 1

  const { error } = await supabase
    .from('tasks')
    .insert([{
      project_id: state.projectId,
      site: nextSite,
      description: desc,
      study_type_id: studyTypeId || null,
      tech_id: techId,
      status: 'pending',
      notes: ''
    }])

  if (error) {
    console.error('Error adding task:', error)
    alert(JSON.stringify(error))
    return
  }

  closeAddTaskModal()
  await loadTasks()
  showToast('Task added')
}

async function handleUpload(file) {
  if (!file) return
  const text = await file.text()
  const lines = text.split('\n').filter(Boolean)
  const studyTypeByCode = {}
  state.studyTypes.forEach(st => studyTypeByCode[st.code.toUpperCase()] = st.id)
  const techByName = {}
  state.techs.forEach(t => techByName[getTechName(t)] = t.id)

  let nextSite = (Math.max(0, ...state.tasks.map(t => t.site || 0)) || 0) + 1
  const rows = []

  lines.forEach(line => {
    const cols = line.split(',')
    const desc = (cols[0] || '').trim().replace(/^"|"$/g, '')
    const typeCode = ((cols[1] || 'OTH').trim().replace(/^"|"$/g, '') || 'OTH').toUpperCase()
    const techName = (cols[2] || '').trim().replace(/^"|"$/g, '')

    if (!desc) return

    rows.push({
      project_id: state.projectId,
      site: nextSite++,
      description: desc,
      study_type_id: studyTypeByCode[typeCode] || null,
      tech_id: techByName[techName] || null,
      status: 'pending',
      notes: ''
    })
  })

  if (!rows.length) return

  const { error } = await supabase.from('tasks').insert(rows)
  if (error) {
    console.error('Error importing tasks:', error)
    alert(JSON.stringify(error))
    return
  }

  closeAddTaskModal()
  await loadTasks()
  showToast(rows.length + ' task' + (rows.length !== 1 ? 's' : '') + ' imported')
}

function closeKebabs() {
  if (state.openKebab) {
    const el = document.getElementById('kebab-' + state.openKebab)
    if (el) el.classList.remove('open', 'drop-up', 'drop-down')
    state.openKebab = null
  }
}

function toggleKebab(id, e) {
  if (e) {
    e.preventDefault()
    e.stopPropagation()
  }

  if (state.openKebab && state.openKebab !== id) {
    const old = document.getElementById('kebab-' + state.openKebab)
    if (old) old.classList.remove('open', 'drop-up', 'drop-down')
  }

  const menu = document.getElementById('kebab-' + id)
  if (!menu) return
  const isOpen = menu.classList.contains('open')
  menu.classList.remove('open', 'drop-up', 'drop-down')

  if (!isOpen) {
    const rect = e.currentTarget.getBoundingClientRect()
    const spaceBelow = window.innerHeight - rect.bottom
    menu.classList.add('open', spaceBelow < 160 ? 'drop-up' : 'drop-down')
    state.openKebab = id
  } else {
    state.openKebab = null
  }
}

function startEdit(id) {
  const row = document.getElementById('row-' + id)
  if (!row) return
  row.classList.add('editing')
  const input = row.querySelector('.edit-input')
  if (input) {
    input.focus()
    input.select()
  }
  closeKebabs()
}

async function saveEdit(id, input) {
  const value = input.value.trim()
  const row = document.getElementById('row-' + id)
  if (!value) {
    row?.classList.remove('editing')
    return
  }

  const { error } = await supabase
    .from('tasks')
    .update({ description: value })
    .eq('id', id)

  if (error) {
    console.error('Error saving task:', error)
    alert(JSON.stringify(error))
    return
  }

  row?.classList.remove('editing')
  await loadTasks()
  showToast('Task updated')
}

async function assignTech(id, techId) {
  const { error } = await supabase
    .from('tasks')
    .update({ tech_id: techId || null })
    .eq('id', id)

  if (error) {
    console.error('Error assigning tech:', error)
    alert(JSON.stringify(error))
    return
  }

  await loadTasks()
  showToast(techId ? 'Tech assigned' : 'Unassigned')
}

function showTechSelect(id, el) {
  const existing = document.querySelector('.tech-dd')
  if (existing) existing.remove()

  const wrapper = el.parentElement
  const task = state.tasks.find(t => t.id === id)
  const dd = document.createElement('div')
  dd.className = 'tech-dd'

  const rect = el.getBoundingClientRect()
  dd.style.left = '-8px'
  if (window.innerHeight - rect.bottom < 200) dd.style.bottom = 'calc(100% + 4px)'
  else dd.style.top = 'calc(100% + 4px)'

  const all = [{ id: '', label: 'Unassigned' }].concat(state.techs.map(t => ({ id: t.id, label: getTechName(t) })))
  all.forEach(item => {
    const div = document.createElement('div')
    div.className = 'tech-dd-item' + ((item.id || '') === (task.techId || '') ? ' selected' : '') + (!item.id ? ' unassigned-opt' : '')
    div.textContent = item.label
    div.addEventListener('click', async ev => {
      ev.stopPropagation()
      await assignTech(id, item.id)
      dd.remove()
    })
    dd.appendChild(div)
  })

  wrapper.appendChild(dd)
  setTimeout(() => {
    const close = evt => {
      if (!dd.contains(evt.target)) {
        dd.remove()
        document.removeEventListener('click', close)
      }
    }
    document.addEventListener('click', close)
  }, 0)
}

function promptDelete(id) {
  state.deleteTarget = id
  const task = state.tasks.find(t => t.id === id)
  document.getElementById('deleteModalBody').textContent = 'Remove "' + (task ? task.desc : 'this task') + '"?'
  openModal('deleteModal')
  closeKebabs()
}

async function confirmDelete() {
  if (!state.deleteTarget) return
  const targetId = state.deleteTarget

  const { data, error } = await supabase
    .from('tasks')
    .delete()
    .eq('id', targetId)
    .select('id')

  if (error) {
    console.error('Error deleting task:', error)
    alert(JSON.stringify(error))
    return
  }

  if (!data || data.length === 0) {
    alert('Delete matched 0 rows')
    return
  }

  state.deleteTarget = null
  closeModal('deleteModal')
  await loadTasks()
  showToast('Task deleted')
}

function promptReopen(id) {
  state.reopenTarget = id
  const task = state.tasks.find(t => t.id === id)
  document.getElementById('reopenModalBody').textContent = 'Send "' + (task ? task.desc : 'this task') + '" back to Pending?'
  document.getElementById('reopenReason').value = ''
  openModal('reopenModal')
  closeKebabs()
}

async function confirmReopen() {
  if (!state.reopenTarget) return
  const reopenReason = document.getElementById('reopenReason').value.trim()

  const { error } = await supabase
    .from('tasks')
    .update({
      status: 'pending',
      reopen_reason: reopenReason || null
    })
    .eq('id', state.reopenTarget)

  if (error) {
    console.error('Error reopening task:', error)
    alert(JSON.stringify(error))
    return
  }

  state.reopenTarget = null
  closeModal('reopenModal')
  await loadTasks()
  showToast('Task reopened')
}

function openJobSheet() {
  const pending  = state.tasks.filter(t => t.statusLabel === STATUS.PENDING)
  const infield  = state.tasks.filter(t => t.statusLabel === STATUS.INFIELD)
  const complete = state.tasks.filter(t => t.statusLabel === STATUS.COMPLETE)
  const meta = [state.project?.client || '', state.project?.location || ''].filter(Boolean).join(' · ')

  // project header
  let html = '<div class="js-project">'
  html += '<div class="js-project-name">' + escapeHtml(state.project?.name || 'Project') + '</div>'
  if (meta) html += '<div class="js-project-meta">' + escapeHtml(meta) + '</div>'
  if (state.project?.project_num) html += '<div class="js-project-num">Project #' + escapeHtml(state.project.project_num) + '</div>'
  html += '</div>'

  // instructions
  if (state.project?.notes) {
    html += '<div class="js-instructions-card">'
    html += '<div class="js-instructions-header"><span class="js-instructions-title">Instructions</span></div>'
    html += '<div class="js-instructions-body">' + escapeHtml(state.project.notes) + '</div>'
    html += '</div>'
  }

  function renderGroup(title, list, headerClass, dotClass) {
    if (!list.length) return ''
    let s = '<div class="js-section">'
    s += '<div class="js-section-header ' + headerClass + '">'
    s += '<div class="js-section-left">'
    s += '<span class="js-section-dot ' + dotClass + '"></span>'
    s += '<span class="js-section-label">' + title + '</span>'
    s += '</div>'
    s += '<span class="js-section-count">' + list.length + '</span>'
    s += '</div>'
    s += '<div class="js-site-list">'
    list.forEach(t => {
      const cycle = getLatestCycle(t.id)
      s += '<div class="js-site">'
      s += '<div class="js-site-header">'
      s += '<span class="js-site-num">#' + t.site + '</span>'
      s += '<span class="js-site-desc">' + escapeHtml(t.desc) + '</span>'
      s += '<div class="js-site-tags">'
      s += '<span class="js-site-tag">' + escapeHtml(t.type) + '</span>'
      if (t.tech) s += '<span class="js-site-tech-init">' + getInitials(t.tech) + '</span>'
      s += '</div></div>'
      const times = []
      if (cycle?.deployed_at) times.push('Set: ' + fmtTime(cycle.deployed_at))
      if (cycle?.completed_at) times.push('Pickup: ' + fmtTime(cycle.completed_at))
      if (cycle?.deployed_at && cycle?.completed_at) times.push('Duration: ' + fmtDur(new Date(cycle.completed_at) - new Date(cycle.deployed_at)))
      else if (cycle?.deployed_at && !cycle?.completed_at) times.push('Duration: ' + fmtDur(Date.now() - new Date(cycle.deployed_at).getTime()))
      if (times.length) s += '<div class="js-site-times">' + times.join(' · ') + '</div>'
      if (t.note) s += '<div class="js-site-note">' + escapeHtml(t.note) + '</div>'
      s += '</div>'
    })
    s += '</div></div>'
    return s
  }

  html += renderGroup('Pending',  pending,  'js-section-header-pending',  'js-section-dot-pending')
  html += renderGroup('In Field', infield,  'js-section-header-infield',  'js-section-dot-infield')
  html += renderGroup('Complete', complete, 'js-section-header-complete', 'js-section-dot-complete')

  // footer
  const now = new Date()
  const dateStr = (now.getMonth() + 1) + '/' + now.getDate() + '/' + now.getFullYear()
  html += '<div class="js-footer">Report generated ' + dateStr + ' · <span class="js-footer-brand">The Count Company</span></div>'

  document.getElementById('jobsheetBody').innerHTML = '<div class="jobsheet-container">' + html + '</div>'
  openModal('jobsheetOverlay')
  document.body.style.overflow = 'hidden'
}

function closeJobSheet() {
  closeModal('jobsheetOverlay')
  document.body.style.overflow = ''
}

  var css='@page{size:letter portrait;margin:12mm 10mm;}*{box-sizing:border-box;margin:0;padding:0;}body{font-family:Inter,sans-serif;background:#fff;color:#1A1D21;font-size:13px;line-height:1.5;-webkit-print-color-adjust:exact;print-color-adjust:exact;}.jobsheet-container{width:100%;max-width:100%;}.js-project{margin-bottom:12px;}.js-project-name{font-size:20px;font-weight:800;letter-spacing:-0.03em;color:#1A1D21;line-height:1.2;margin-bottom:3px;}.js-project-meta{font-size:12px;color:#6B7178;margin-bottom:2px;}.js-instructions-card{background:#fff;border-radius:8px;margin-bottom:10px;overflow:hidden;border:1px solid #E0DED8;break-inside:avoid;page-break-inside:avoid;}.js-instructions-header{display:flex;align-items:center;justify-content:space-between;background:#4A7A5E;padding:7px 12px;}.js-instructions-title{font-size:10px;font-weight:800;letter-spacing:0.1em;text-transform:uppercase;color:#fff;}.js-instructions-body{padding:10px 12px;font-size:12.5px;font-weight:600;color:#2A2D31;line-height:1.5;}.js-section{background:#fff;border-radius:8px;margin-bottom:10px;border:1px solid #E0DED8;break-before:avoid;page-break-before:avoid;}.js-section-header{display:flex;align-items:center;justify-content:space-between;padding:7px 12px;}.js-section-header-pending{background:#F5EDD6;}.js-section-header-infield{background:#DCEAF8;}.js-section-header-complete{background:#D4EDDF;}.js-section-left{display:flex;align-items:center;gap:8px;}.js-section-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}.js-section-dot-pending{background:#D4A843;}.js-section-dot-infield{background:#4A7FBF;}.js-section-dot-complete{background:#3AA66A;}.js-section-label{font-size:10px;font-weight:800;letter-spacing:0.1em;text-transform:uppercase;}.js-section-header-pending .js-section-label{color:#6B4A08;}.js-section-header-infield .js-section-label{color:#1C4A7A;}.js-section-header-complete .js-section-label{color:#1A5C35;}.js-section-count{font-size:11px;font-weight:700;padding:2px 8px;border-radius:100px;}.js-section-header-pending .js-section-count{background:rgba(107,74,8,0.14);color:#6B4A08;}.js-section-header-infield .js-section-count{background:rgba(28,74,122,0.14);color:#1C4A7A;}.js-section-header-complete .js-section-count{background:rgba(26,92,53,0.16);color:#1A5C35;}.js-site-list{padding:2px 0;}.js-site{padding:8px 12px;border-bottom:1px solid #F0EEE9;break-inside:avoid;page-break-inside:avoid;}.js-site:last-child{border-bottom:none;}.js-site-header{display:flex;align-items:center;gap:8px;margin-bottom:3px;}.js-site-num{font-size:12px;font-weight:700;color:#9DA3AA;flex-shrink:0;min-width:24px;}.js-site-desc{font-size:14px;font-weight:700;color:#1A1D21;flex:1;letter-spacing:-0.01em;line-height:1.2;}.js-site-tags{display:flex;gap:4px;flex-shrink:0;}.js-site-tag{font-size:10px;font-weight:700;letter-spacing:0.04em;padding:3px 7px;border-radius:6px;background:#ECEAE4;color:#4A4F55;}.js-site-times{font-size:11.5px;color:#7D838A;margin-top:3px;line-height:1.4;}.js-site-note{font-size:12px;font-weight:600;color:#4A4F55;margin-top:4px;font-style:italic;}.js-footer{margin-top:24px;padding-top:12px;border-top:1px solid #DEDBD5;text-align:center;font-size:11px;color:#9DA3AA;}.js-footer-brand{font-weight:700;color:#6B7178;}';
  var pw=window.open('','_blank','width=850,height=700');
  pw.document.write('<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Job Sheet</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>'+css+'</style></head><body>'+content+'</body></html>');
  pw.document.close();

};
}

  document.getElementById('mobileNavMenu').classList.toggle('open')
}

  e.stopPropagation()
  toggleMobileNav()
})

document.getElementById('openAddTaskModalBtn').addEventListener('click', openAddTaskModal)
document.getElementById('closeAddTaskModalBtn').addEventListener('click', closeAddTaskModal)
document.getElementById('closeAddTaskModalBtnBulk').addEventListener('click', closeAddTaskModal)
document.getElementById('submitAddTaskBtn').addEventListener('click', addTask)

document.getElementById('closeReopenModalBtn').addEventListener('click', () => closeModal('reopenModal'))

document.getElementById('fileInput').addEventListener('change', e => handleUpload(e.target.files[0]))

document.getElementById('taskSections').addEventListener('click', e => {
  const actionEl = e.target.closest('[data-action]')
  if (!actionEl) return

  const action = actionEl.dataset.action
  const id = actionEl.dataset.id

  if (actionEl.closest('.kebab-cell') || actionEl.closest('.kebab-menu')) e.stopPropagation()

  if (action === 'toggle-kebab') return toggleKebab(id, e)
  if (action === 'edit-task') return startEdit(id)
  if (action === 'delete-task') return promptDelete(id)
  if (action === 'reopen-task') return promptReopen(id)
  if (action === 'show-tech') return showTechSelect(id, actionEl)
})

document.getElementById('taskSections').addEventListener('keydown', e => {
  const input = e.target.closest('.edit-input')
  if (!input) return
  if (e.key === 'Enter') saveEdit(input.dataset.id, input)
})

document.getElementById('taskSections').addEventListener('focusout', e => {
  const input = e.target.closest('.edit-input')
  if (!input) return
  if (document.getElementById('row-' + input.dataset.id)?.classList.contains('editing')) {
    saveEdit(input.dataset.id, input)
  }
})

document.addEventListener('click', e => {
  if (!e.target.closest('.m-kebab,.mobile-nav-menu')) {
    document.getElementById('mobileNavMenu').classList.remove('open')
  }
  if (!e.target.closest('.kebab-cell,.kebab-menu')) closeKebabs()
})

document.querySelectorAll('.modal-overlay').forEach(el => {
  el.addEventListener('click', function(e) {
    if (e.target === this) {
      this.classList.remove('visible')
      if (this.id === 'jobsheetOverlay') document.body.style.overflow = ''
    }
  })
})

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    closeAddTaskModal()
    closeModal('deleteModal')
    closeModal('reopenModal')
    closeJobSheet()
  }
})

await loadAll()
